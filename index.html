 if(P&&P.home==='study')return vRun();
 const fs=[['all','Tất cả'],['un','Chưa học'],['done','Đã học'],['ng','Sai gần nhất'],['fav','Yêu thích']];
 const card=(key,name,sub,ids)=>{const t=stOf(ids),c=filt(ids,SF).length;
  return `<button class="sc" data-a="study" data-v="${key}"><b>${esc(name)}</b><small>${esc(sub)}</small>

  ${st.pos[key]!=null&&SF==='all'?`<small>Đang ở câu ${st.pos[key]+1}</small>`:''}</button>`};
 return `<h1>Học theo từng bài</h1><p class="mu">Chọn bài muốn học. Đáp án đúng/sai được hiển thị ngay sau khi bạn chọn.</p>

 <div class="secs">${card('all','Toàn bộ ngân hàng','Tất cả các bài',ALLIDS)}${card('fav','★ Câu yêu thích','Các câu bạn đã đánh dấu',ALLIDS.filter(i=>st.fav[i]))}

A.study=key=>{const base=key==='all'?ALLIDS:key==='fav'?ALLIDS.filter(i=>st.fav[i]):idsOfSec(key);

 const nm=key==='all'?'Toàn bộ ngân hàng':key==='fav'?'Câu yêu thích':secOf(key).name;
 st.lastSec=key;let i=0;if(SF==='all'&&st.pos[key]!=null)i=st.pos[key];save();
 if(V!=='study'){location.hash='study';}
 startRun('study',nm,ids,i,key)};

/* ===== Thi thử ===== */
function vExam(){if(st.exam)return vExamRun();if(EX)return vExamRes();return vExamSetup()}
function vExamSetup(){
 const c=st.xcfg||{secs:D.map(s=>s.id),n:40,min:30,sq:1,so:1};
 const ex=st.exams.slice(-5).reverse().map((e,k)=>`<tr><td>${fmt(e.ts)}</td><td><b>${e.score}</b>/10</td><td>${e.c}✓ ${e.w}✗ ${e.b}○</td><td><button class="btn sm" data-a="xview" data-v="${st.exams.indexOf(e)}">Xem lại</button></td></tr>`).join('');
 return `<h1>Thi thử</h1><div class="card" id="xform"><h3 style="margin-top:0">1. Phạm vi đề thi</h3>
 <div class="chips">${D.map(s=>`<label class="chip"><input type="checkbox" class="xs" value="${s.id}" ${c.secs.includes(s.id)?'checked':''}>${esc(s.name)} <small>(${s.q.length})</small></label>`).join('')}</div>
 <button class="btn sm" data-a="xall" data-v="1">Chọn toàn bộ ngân hàng</button> <button class="btn sm" data-a="xall" data-v="0">Bỏ chọn tất cả</button>
 <h3>2. Cấu hình</h3><div class="row" style="gap:20px"><label class="fl">Số câu hỏi<input type="number" id="xn" min="1" value="${c.n}"></label><label class="fl">Thời gian làm bài (phút)<input type="number" id="xm" min="1" max="300" value="${c.min}"></label></div>
 <div style="margin:10px 0"><label><input type="checkbox" id="xsq" ${c.sq?'checked':''}>Trộn ngẫu nhiên thứ tự câu hỏi</label><br><label><input type="checkbox" id="xso" ${c.so?'checked':''}>Trộn ngẫu nhiên thứ tự đáp án</label></div>
 <p id="xinfo" class="mu"></p><p class="mu">Đáp án không hiển thị trong khi thi. Điểm thang 10, mỗi câu đúng có điểm bằng nhau; câu bỏ trống không được tính.</p>
 <button class="btn pri" data-a="xstart">▶ Bắt đầu thi</button></div>
 ${ex?`<div class="card"><h2>Các lần thi gần đây</h2><div class="tw"><table>${ex}</table></div></div>`:''}`}
function xinfo(){const el=$('#xinfo');if(!el)return;const secs=[...document.querySelectorAll('.xs:checked')].map(x=>x.value);
 const pool=ALL.filter(q=>secs.includes(q.s)).length,n=+$('#xn').value||0;
 el.textContent=pool?`Phạm vi đã chọn có ${pool} câu. Đề thi sẽ gồm ${Math.min(Math.max(n,1),pool)} câu.`:'Hãy chọn ít nhất một bài.'}
A.xall=v=>{document.querySelectorAll('.xs').forEach(x=>x.checked=v==='1');xinfo()};
function makeExam(cfg){
 const pool=ALL.filter(q=>cfg.secs.includes(q.s));if(!pool.length){toast('Hãy chọn ít nhất một bài.');return}
 cfg.n=clamp(Math.round(cfg.n),1,pool.length);cfg.min=clamp(Math.round(cfg.min),1,300);
 let pick=shuffle(pool).slice(0,cfg.n);if(!cfg.sq)pick.sort((a,b)=>a.k-b.k);
 st.xcfg=cfg;st.exam={cfg,items:pick.map(q=>({id:q.id,ord:cfg.so?shuffle([0,1,2,3]):[0,1,2,3]})),ans:{},mark:{},i:0,start:Date.now(),end:Date.now()+cfg.min*60000};
 EX=null;save();render(true)}
A.xstart=()=>makeExam({secs:[...document.querySelectorAll('.xs:checked')].map(x=>x.value),n:+$('#xn').value,min:+$('#xm').value,sq:$('#xsq').checked?1:0,so:$('#xso').checked?1:0});
function vExamRun(){
 const E=st.exam,it=E.items[E.i],q=Q[it.id],sel=E.ans[it.id],n=E.items.length,an=Object.keys(E.ans).length;
 const o=it.ord.map((orig,j)=>{const L=LT[orig];return `<button class="opt${sel===L?' sel':''}" data-a="xpick" data-v="${L}"><b>${LT[j]}</b><span>${esc(q.o[orig])}</span></button>`}).join('');
 const grid=E.items.map((x,k)=>`<button class="qn${E.ans[x.id]?' an':''}${E.mark[x.id]?' mk':''}${k===E.i?' cur':''}" data-a="xgo" data-v="${k}">${k+1}</button>`).join('');
 return `<div class="xhd"><div><small>Thời gian còn lại</small><div id="tm">--:--</div></div><div><small>Đã trả lời</small><div><b>${an}/${n}</b></div></div><button class="btn pri" data-a="xsubmit">Nộp bài</button></div>
 <div class="xw"><div><div class="card"><div class="row sb"><span class="tag">Câu ${E.i+1}/${n}</span>${E.mark[it.id]?'<span class="tag" style="background:var(--wab);color:var(--wa)">Đang đánh dấu chưa chắc chắn</span>':''}</div>
 <div class="qt">${esc(q.t)}</div>${o}</div>
 <div class="row sb"><button class="btn" data-a="xgo" data-v="${E.i-1}" ${E.i?'':'disabled'}>← Trước</button>
 <span class="row"><button class="btn" data-a="xmark">${E.mark[it.id]?'Bỏ đánh dấu':'⚑ Chưa chắc chắn'}</button><button class="btn" data-a="xclear" ${sel?'':'disabled'}>Bỏ chọn</button></span>
 <button class="btn pri" data-a="xgo" data-v="${E.i+1}" ${E.i<n-1?'':'disabled'}>Sau →</button></div></div>
 <div class="card"><b>Bảng điều hướng</b><div class="qg">${grid}</div><p class="mu" style="font-size:.85rem;margin-bottom:0">■ xanh: đã trả lời · ● cam: chưa chắc chắn</p></div></div>`}
A.xpick=L=>{const E=st.exam,id=E.items[E.i].id;E.ans[id]=L;save();render()};
A.xclear=()=>{const E=st.exam;delete E.ans[E.items[E.i].id];save();render()};
A.xmark=()=>{const E=st.exam,id=E.items[E.i].id;if(E.mark[id])delete E.mark[id];else E.mark[id]=1;save();render()};
A.xgo=v=>{const E=st.exam;E.i=Math.min(Math.max(+v,0),E.items.length-1);save();render(true)};
A.xsubmit=()=>submitExam(false);
function startTimer(){clearInterval(timer);
 const t=()=>{const E=st.exam;if(!E){clearInterval(timer);return}const r=Math.max(0,Math.round((E.end-Date.now())/1000)),el=$('#tm');
  if(el){el.textContent=mmss(r);el.classList.toggle('low',r<60)}
  if(r<=0){clearInterval(timer);toast('Hết giờ — bài thi được nộp tự động.');submitExam(true)}};
 t();timer=setInterval(t,1000)}
function submitExam(auto){
 const E=st.exam;if(!E)return;const un=E.items.filter(x=>!E.ans[x.id]).length;
 if(!auto&&!confirm(un?`Bạn còn ${un} câu chưa trả lời. Nộp bài ngay?`:'Nộp bài và xem kết quả?'))return;
 clearInterval(timer);let c=0,w=0,b=0;const secs={};
 E.items.forEach(x=>{const q=Q[x.id],s=secs[q.s]||(secs[q.s]=[0,0]),a=E.ans[x.id];s[1]++;
  if(!a)b++;else{const ok=isOk(q,a);rec(x.id,ok,true);if(ok){c++;s[0]++}else w++}});
 const n=E.items.length,r={ts:Date.now(),total:n,c,w,b,score:Math.round(c/n*1000)/100,secs,cfg:E.cfg,
  used:Math.min(Math.round((Date.now()-E.start)/1000),E.cfg.min*60),items:E.items.map(x=>({id:x.id,ord:x.ord,a:E.ans[x.id]||null,m:E.mark[x.id]?1:0}))};
 st.exams.push(r);if(st.exams.length>40)st.exams.shift();
 addHist('exam',`Thi thử ${n} câu: ${c} đúng, ${w} sai, ${b} bỏ trống — ${r.score}/10 điểm`);
 st.exam=null;EX=r;XF='all';save();render(true)}
function vExamRes(){
 const r=EX,fl=[['all','Tất cả'],['ng','Sai'],['bl','Bỏ trống'],['ok','Đúng']];
 const secRows=Object.keys(r.secs).map(k=>`<tr><td>${esc(secOf(k).name)}</td><td>${r.secs[k][0]}/${r.secs[k][1]}</td><td>${pct(r.secs[k][0],r.secs[k][1])}%</td></tr>`).join('');
 const list=r.items.map((x,k)=>{const q=Q[x.id],s=!x.a?'bl':isOk(q,x.a)?'ok':'ng';if(XF!=='all'&&XF!==s)return '';

 const k=e.key.toLowerCase(),L='abcd'.indexOf(k)>=0?k.toUpperCase():'1234'.indexOf(k)>=0?LT['1234'.indexOf(k)]:null;
 if(V==='exam'&&st.exam){const E=st.exam,it=E.items[E.i];
  if(L){const j=LT.indexOf(L);A.xpick(LT[it.ord[j]])}else if(e.key==='ArrowRight')A.xgo(E.i+1);else if(e.key==='ArrowLeft')A.xgo(E.i-1);return}
 if(P&&P.home===V&&!P.sum){if(L)A.pick(L);else if(e.key==='ArrowRight')A.rgo(P.i+1);else if(e.key==='ArrowLeft')A.rgo(P.i-1);return}
 if(V==='flash'&&F){if(e.key===' '){e.preventDefault();A.flip()}else if(e.key==='ArrowRight')A.fgo(F.i+1);else if(e.key==='ArrowLeft')A.fgo(F.i-1)}});
window.addEventListener('hashchange',()=>render());
load();applyTheme();
if(st.exam&&!(Array.isArray(st.exam.items)&&st.exam.items.every(x=>Q[x.id]))){st.exam=null;save()}
render();
</script>
