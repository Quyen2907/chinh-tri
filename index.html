<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn thi Giáo dục chính trị</title>
<style>
:root{color-scheme:light;--bg:#f3f5fa;--card:#fff;--tx:#1b2333;--mu:#65718a;--bd:#e1e6f0;--pr:#2563eb;--btn:#2563eb;--ok:#15803d;--okb:#dcfce7;--ng:#dc2626;--ngb:#fee2e2;--wa:#b45309;--wab:#fef3c7;--sh:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.05)}
[data-theme=dark]{color-scheme:dark;--bg:#0e1420;--card:#172033;--tx:#e7ecf6;--mu:#93a0ba;--bd:#27334b;--pr:#7db4ff;--btn:#2f6fe4;--ok:#4ade80;--okb:#10341e;--ng:#f87171;--ngb:#3a1717;--wa:#fbbf24;--wab:#38290a;--sh:none}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}
h1{font-size:1.5rem;margin:.2em 0 .8em}h2{font-size:1.15rem;margin:0 0 .6em}h3{font-size:1rem;margin:1em 0 .5em}
.mu{color:var(--mu)}small{color:var(--mu)}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:var(--card);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;z-index:30}
.brand{font-weight:700;font-size:1.05rem;padding:4px 10px 14px;line-height:1.3}.brand small{display:block;font-weight:400}
.nv{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;margin-bottom:2px}
.nv:hover{background:var(--bg)}.nv.act{background:var(--btn);color:#fff}
.nv .bd{margin-left:auto;background:var(--ng);color:#fff;border-radius:99px;font-size:.72rem;padding:0 7px}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bd)}
.top input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 12px}
#mb{display:none}
#view{padding:20px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--pr)}.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.dg{border-color:var(--ng);color:var(--ng)}.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}
.bar{display:flex;height:9px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 12px;cursor:pointer;background:var(--card);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}.chip.on small{color:#fff}
.secs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;text-align:left;box-shadow:var(--sh)}
.sc:hover{border-color:var(--pr)}.sc small{display:block;min-height:2.6em}
.qt{font-size:1.08rem;font-weight:600;white-space:pre-line;margin:.4em 0 1em}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:11px 14px;margin-bottom:9px;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--pr)}.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.85rem}
.opt span{white-space:pre-line;padding-top:2px}
.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ng{border-color:var(--ng);background:var(--ngb)}
.opt.ok b{background:var(--ok);color:#fff}.opt.ng b{background:var(--ng);color:#fff}
.fb{padding:10px 14px;border-radius:10px;margin:6px 0 12px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.ng{background:var(--ngb);color:var(--ng)}
.note{background:var(--wab);color:var(--wa);padding:9px 12px;border-radius:10px;margin:8px 0;font-size:.9rem}
.star{border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--mu);line-height:1}.star.on{color:#f59e0b}
.qg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qn{min-width:36px;height:36px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer;position:relative}
.qn.ok{background:var(--okb);border-color:var(--ok)}.qn.ng{background:var(--ngb);border-color:var(--ng)}
.qn.an{background:var(--btn);color:#fff;border-color:var(--btn)}.qn.mk::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#f59e0b}
.qn.cur{outline:2.5px solid var(--pr);outline-offset:1px}
.xw{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.xhd{position:sticky;top:57px;z-index:10;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;margin-bottom:14px;box-shadow:var(--sh)}
#tm{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}#tm.low{color:var(--ng)}
.big{font-size:3rem;font-weight:800;line-height:1}
.fc{min-height:230px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.fcl{font-size:.8rem;text-transform:uppercase;color:var(--mu);letter-spacing:.06em}
.dn{width:150px;height:150px;border-radius:50%;position:relative;flex:none}.dn::after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--card)}
.dn div{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-weight:700;font-size:1.3rem}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.ri{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--card);cursor:pointer}.ri:hover{border-color:var(--pr)}
.tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 8px;background:var(--bg);color:var(--mu);margin-right:4px}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.ng{background:var(--ngb);color:var(--ng)}
input[type=number],select{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 10px}
label{display:inline-flex;gap:6px;align-items:center}
.fl{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;display:none;max-width:90vw}
#ov{display:none}
@media(max-width:860px){
.side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh)}.side.open{transform:none}
#ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
#mb{display:inline-block}.top{padding:8px 12px}#view{padding:12px}.xw{grid-template-columns:1fr}.xhd{top:53px}
.big{font-size:2.3rem}
}
</style>
</head>

<script>
const D=[{"id":"m","name":"Mở đầu","title":"Bài mở đầu","q":[{"id":"m-1","n":1,"t":"Môn học Giáo dục chính trị có ý nghĩa quan trọng hàng đầu giúp cho mỗi người học hiểu biết được nội dung cơ bản về:","o":["Chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh và đường lối chính sách của Đảng ta","Chỉ hiểu biết kiến thức về Chủ nghĩa Mác - Lênin","Hiểu biết về xã hội xã hội","Hiểu biết về đời sống chính trị"],"a":"A"},{"id":"m-2","n":2,"t":"Theo V.I.Lênin, Chính trị là biểu hiện tập trung của:","o":["Văn hóa","Chính trị","Kinh tế","Chính sách"],"a":"C"},{"id":"m-3","n":3,"t":"Môn học giáo dục Chính trị gắn bó chặt chẽ với:","o":["Đường lối của Đảng, chính sách, pháp luật của Nhà nước","Hệ thống kiến thức chung","Hệ tư tưởng chính trị","Kiến thức văn hóa"],"a":"A"},{"id":"m-4","n":4,"t":"Môn giáo dục chính trị có chức năng giáo dục:","o":["Truyền thống cách mạng dân tộc","Hệ tư tưởng Mác – lênin","Tư tưởng chính trị","Niềm tin vào sự lãnh đạo của Đảng Cộng sản Việt Nam"],"a":"D"},{"id":"m-5","n":5,"t":"Phương pháp giảng dạy và học tập môn chính trị ở các trường dạy nghề nhằm phát huy tính chủ động của thầy và tính:","o":["Tự học của trò","Tính độc lập của người học","Sáng tạo của người học","Tích cực của trò"],"a":"D"},{"id":"m-6","n":6,"t":"Nghiên cứu, học tập, nắm vững tri thức chính trị có ý nghĩa rất to lớn trong việc:","o":["Giáo dục tinh thần yêu dân tộc","Giáo dục phẩm chất đạo đức","Giáo dục phẩm chất chính trị","Hình thành phẩm chất tích cực"],"a":"C"},{"id":"m-7","n":7,"t":"Mục đích của môn học chính trị nhằm:","o":["Trang bị cho người học nhận thức về văn hóa, giao tiếp","Trang bị cho người học những kỹ năng sống","Góp phần bồi dưỡng tư tưởng, giáo dục niềm tin vào sự lãnh đạo của Đảng và định hướng trong quá trình học tập, rèn luyện cho người học","Xây dựng thành công chủ nghĩa xã hội, chủ nghĩa cộng sản"],"a":"C"},{"id":"m-8","n":8,"t":"Nhiệm vụ quan trọng của môn học Chính trị:","o":["Nghiên cứu các hoạt động xây dựng chế độ và hoạt động của hệ thống chính trị ở nước ta","Nghiên cứu đời sống xã hội","Nghiên cứu các hoạt động tư tưởng, văn hóa","Làm rõ nhu cầu vật chất và nhu cầu tinh thần của nhân dân"],"a":"A"},{"id":"m-9","n":9,"t":"Đảng ta đánh giá, công tác giáo dục chính trị là một bộ phận của lĩnh vực:","o":["Khoa học nghệ thuật; Khoa học lý luận","Khoa học chính trị; Khoa học đời sống","Khoa học chính trị; Công tác tư tưởng","Công tác tư tưởng; Hoạt động chính trị"],"a":"C"},{"id":"m-10","n":10,"t":"Đảng ta đánh giá, giáo dục chính trị gắn bó chặt chẽ với nội dung:","o":["Hoạt động sản xuất vật chất","Hoạt động chính trị","Công tác tư tưởng","Đường lối, chính sách, pháp luật của Đảng và Nhà nước"],"a":"D"}]},{"id":"1","name":"Bài 1","title":"KHÁI QUÁT VỀ CHỦ NGHĨA MÁC - LÊNIN","q":[{"id":"1-1","n":1,"t":"Chủ nghĩa Mác – Lênin bao gồm mấy bộ phận lý luận cấu thành?","o":["2","3","4","5"],"a":"B"},{"id":"1-2","n":2,"t":"Chủ nghĩa Mác – Lênin được cấu thành bởi những bộ phận nào?","o":["Triết học Mác – Lênin; Kinh tế chính trị Mác – Lênin; Chủ nghĩa xã hội khoa học","Kinh tế chính trị Mác – Lênin; Chủ nghĩa xã hội khoa học; Lịch sử ĐCS","Chủ nghĩa xã hội khoa học; Triết học Mác – Lênin; Lịch sử ĐCS","Triết học Mác – Lênin; Kinh tế chính trị Mác – Lênin; Lịch sử ĐCS"],"a":"A"},{"id":"1-3","n":3,"t":"Nội dung nào thể hiện bản chất cách mạng và khoa học của chủ nghĩa Mác – Lênin?","o":["Một hệ thống lý luận về các nguyên lý trụ cột trong hệ thống tri thức của nhân loại","Một học thuyết mở, không ngừng tự đổi mới, tự phát triển trong hệ thống tri thức của nhân loại.","Một học thuyết lý luận thể hiện bản chất của giai cấp công nhân và nhân dân lao động","Một học thuyết lý luận thể hiện bản chất của giai cấp vô sản và phương pháp luận cách mạng"],"a":"B"},{"id":"1-4","n":4,"t":"Nội dung nào thể hiện bản chất cách mạng và khoa học của chủ nghĩa Mác – Lênin?","o":["Một hệ thống lý luận khoa học thể hiện bản chất của giai cấp vô sản và tư tưởng tư sản","Một hệ thống lý luận nghiên cứu những quy luật cơ bản của xã hội","Một hệ thống lý luận khoa học, thể hiện trong toàn bộ các nguyên lý cấu thành học thuyết, trước hết là các nguyên lý trụ cột","Một hệ thống lý luận thể hiện bản chất của giai cấp tư sản và phương pháp luận cách mạng"],"a":"C"},{"id":"1-5","n":5,"t":"Nội dung nào thể hiện bản chất cách mạng và khoa học của chủ nghĩa Mác – Lênin?","o":["Sự thống nhất hữu cơ giữa thế giới quan khoa học và phương pháp luận trong chủ nghĩa Mác – Lênin","Quy luật lực lượng sản xuất phải phù hợp với tính chất và trình độ của quan hệ sản xuất","Quy luật kiến trúc thượng tầng phải phù hợp với cơ sở hạ tầng","Sự thống nhất hữu cơ giữa thế giới quan khoa học và phép biện chứng"],"a":"A"},{"id":"1-6","n":6,"t":"Theo quan điểm triết học Mác – Lênin, đâu là thuộc tính chung nhất của vật chất?","o":["Tồn tại khách quan, không lệ thuộc vào cảm giác","Tồn tại không khách quan","Phụ thuộc vào cảm giác của con người","Tồn tại trừu tượng"],"a":"A"},{"id":"1-7","n":7,"t":"Định nghĩa vật chất của Lênin bao quát đặc tính quan trọng nhất của mọi dạng vật chất đế phân biệt với ý thức, đó là đặc tính gì?","o":["Vận động và biến đổi","Nhỏ nhất không thể phân chia được","Thực tại khách quan độc lập với ý thức con người","Có khối lượng và quảng tính"],"a":"C"},{"id":"1-8","n":8,"t":"Định nghĩa vật chất của Lênin đã mở đường cho các ngành khoa học cụ thể đi sâu nghiên cứu:","o":["Vật chất","Ý thức","Thế giới","Chủ nghĩa duy tâm"],"a":"C"},{"id":"1-9","n":9,"t":"Định nghĩa vật chất của Lênin đem lại niềm tin cho con người trong việc nhận thức thế giới và:","o":["Cải tạo thế giới","Phát triển thế giới","Nhận thức về con người","Nhận thức về vĩ nhân"],"a":"A"},{"id":"1-10","n":10,"t":"Định nghĩa vật chất của Lênin đã giải quyết được vấn đề cơ bản của triết học theo lập trường:","o":["Duy tâm","Duy vật biện chứng","Duy vật","Duy vật siêu hình"],"a":"B"},{"id":"1-11","n":11,"t":"Theo quan điểm của triết học Mác – Lênin, vận động là:","o":["Mọi sự thay đổi về vị trí trong các mối quan hệ xã hội, trong tự nhiên và trong tư duy củ dựng con người xã hội chủ nghĩa","Đấu tranh của các giai cấp và tầng lớp xã hội"],"a":"A"},{"id":"4-23","n":23,"t":"Chọn phương án trả lời đúng. Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH(bổ sung và phát triển năm 2011) xác định phương hướng cơ bản xây dựng nền văn hóa?","o":["Tiên tiến","Tiên tiến, đậm đà bản sắc dân tộc","Tiên tiến, hiện đại","Hiện đại và văn minh"],"a":"B"},{"id":"4-24","n":24,"t":"Chọn phương án trả lời đúng. Phương hướng cơ bản xây dựng đất nước trong thời kỳ quá độ lên CNXH ở Việt Nam về đối ngoại là thực hiện đường lối đối ngoại?","o":["Độc lập, tự chủ","Độc lập, tự chủ và chủ động","Hòa bình, tự chủ","Độc lập, tự chủ, hòa bình"],"a":"D"},{"id":"4-25","n":25,"t":"Chọn phương án trả lời đúng. Mục tiêu xây dựng đất nước trong thời kỳ quá độ lên CNXH ở Việt Nam về đại đoàn kết dân tộc là thực hiện?","o":["Đại đoàn kết dân tộc","Đoàn kết xã hội","Đoàn kết giữa các giai cấp","Đoàn kết các tầng lớp"],"a":"A"},{"id":"4-26","n":26,"t":"Chọn phương án trả lời đúng nhất. Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH(bổ sung và phát triển năm 2011) xác định phương hướng xây dựng nhà nước pháp quyền xã hội chủ nghĩa là nhà nước:","o":["Do nhân dân làm chủ","Của nhân dân","Của nhân dân, do nhân dân, vì nhân dân","Do nhân dân và vì nhân dân"],"a":"C"},{"id":"4-27","n":27,"t":"Chọn phương án trả lời đúng nhất. Đảng lãnh đạo nhân dân thực hiện hai nhiệm vụ:","o":["Xây dựng Tổ quốc","Bảo vệ Tổ quốc","Xây dựng Tổ quốc Việt Nam XHCN","Chiến lược xây dựng và bảo vệ Tổ quốc Việt Nam XHCN"],"a":"D"},{"id":"4-28","n":28,"t":"Chọn phương án trả lời đúng. Sự lãnh đạo đúng đắn của Đảng là nhân tố?","o":["Khách quan bảo đảm thắng lợi của cách mạng Việt Nam","Trung tâm bảo đảm thắng lợi của cách mạng Việt Nam","Cơ bản bảo đảm thắng lợi của cách mạng Việt Nam","Hàng đầu bảo đảm thắng lợi của cách mạng Việt Nam"],"a":"D"},{"id":"4-29","n":29,"t":"So với Cương lĩnh 1991, Cương lĩnh 2011 đã bổ sung mấy đặc trưng cơ bản của CNXH ở nước ta:","o":["1 đặc trưng","2 đặc trưng","3 đặc trưng","4 đặc trưng"],"a":"B"},{"id":"4-30","n":30,"t":"Chọn phương án trả lời đúng. Đại hội XII xác định các nhiệm vụ trụ cột của cách mạng nước ta hiện nay là phát triển kinh tế - xã hội là nhiệm vụ trọng tâm, xây dựng Đảng là:","o":["Nhiệm vụ trọng yếu","Nhiệm vụ chiến lược","Nhiệm vụ then chốt","Nhiệm vụ thường xuyên"],"a":"C"},{"id":"4-31","n":31,"t":"Chọn phương án trả lời đúng. Đại hội XII nêu rõ, xây dựng, hoàn thiện Nhà nước pháp quyền XHCN do Đảng lãnh đạo là nhiệm vụ:","o":["Trọng tâm của đổi mới hệ thống chính trị","Trọng yếu của đổi mới hệ thống chính trị","Chiến lược của đổi mới hệ thống chính trị","Thường xuyên của đổi mới hệ thống chính trị"],"a":"A"},{"id":"4-32","n":32,"t":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH(bổ sung và phát triển năm 2011) xác định bao nhiêu phương hướng cơ bản trong xây dựng XHCN:","o":["6 phương hướng","7 phương hướng","8 phương hướng","9 phương hướng"],"a":"C"},{"id":"4-33","n":33,"t":"Chọn phương án trả lời đúng. Theo quan điểm của Đảng ta, hai nhiệm vụ chiến lược của cách mạng Việt Nam hiện nay là:","o":["Bảo vệ và phát nền dân chủ tư sản tiến bộ trên thế giới","Xây dựng và bảo vệ chế độ cộng sản chủ nghĩa","Xây dựng chủ nghĩa xã hội và chủ nghĩa cộng sản","Xây dựng chủ nghĩa xã hội và bảo vệ tổ quốc xã hội chủ nghĩa"],"a":"D"},{"id":"4-34","n":34,"t":"Chọn phương án trả lời đúng. Giai cấp công nhân Việt Nam thực hiện lãnh đạo cách mạng thông qua đội tiên phong là:","o":["Hội cựu chiến binh","Mặt trận tổ quốc Việt Nam","Tổng liên đoàn lao động Việt Nam","Đảng cộng sản Việt Nam"],"a":"D"},{"id":"4-35","n":35,"t":"Chọn phương án trả lời đúng. Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH (bổ sung, phát triển năm 2011) xác định:","o":["Có một nền kinh tế phát triển cao, dựa vào nền công nghiệp nặng có giá trị kinh tế","Có một nền kinh tế phát triển cao, dựa trên lực lượng sản xuất hiện đại với quan hệ sản xuất tiến bộ phù hợp.","Có một nền kinh tế phát triển cao, dựa vào tài nguyên thiên nhiên sẵn có với việc khai thác khoa học và hiệu quả","Có một nền kinh tế phát triển cao, thế mạnh phát triển nông nghiệp"],"a":"B"},{"id":"4-36","n":36,"t":"Chọn phương án trả lời đúng nhất. Bản chất của chủ nghĩa xã hội là xã hội?","o":["Có nền kinh tế phát triển cao được xây dựng trên cơ sở lực lượng sản xuất hiện đại và phát triển bền vững.","Có quan hệ sản xuất hiện đại","Có Lực lượng sản xuất hiện đại","Có nền kinh tế phát triển bền vững"],"a":"A"},{"id":"4-37","n":37,"t":"Chọn phương án trả lời đúng nhất. Hồ Chí Minh nói một cách tóm tắt, mộc mạc, chủ nghĩa xã hội trước hết nhằm làm cho nhân dân lao động thoát nạn bần cùng, làm cho mọi người đều có?","o":["Cuộc sống đầy đủ","Cơm ăn áo mặc","Công ăn, việc làm được ấm no và sống một đời hạnh phúc","Nơi ở và việc làm đầy đủ"],"a":"C"},{"id":"4-38","n":38,"t":"Chọn phương án trả lời đúng nhất. Theo quan điểm Đảng ta, mục tiêu cuối cùng của cách mạng XHCN là?","o":["Xóa bỏ chế độ tư hữu","Giải phóng con người, giải phóng xã hội","Xóa bỏ chế độ tư bản chủ nghĩa","Giành chính quyền về tay giai cấp công nhân"],"a":"B"},{"id":"4-39","n":39,"t":"Chọn phương án trả lời đúng. Nước ta quá độ lên CNXH bỏ qua chế độ TBCN là:","o":["Bỏ qua việc xác lập địa vị thống trị của QHSX và KTTT TBCN","Kế thừa thành tựu nhân loại đạt được trong CNTB","Dựa trên chế độ công hữu về TLSX","Phát triển LLSX C"],"a":"A"},{"id":"4-40","n":40,"t":"So với Cương lĩnh 1991, Đại hội XII đã bổ sung và phát triển, nêu lên bao nhiêu đặc trưng của xã hội XHCN ở nước ta?","o":["9 đặc trưng","8 đặc trưng","7 đặc trưng","6 đặc trưng"],"a":"B"},{"id":"4-41","n":41,"t":"Chọn phương án trả lời đúng nhất. Chỉ có chủ nghĩa xã hội mới giải phóng triệt để giai cấp vô sản và nhân dân lao động khỏi?","o":["Ách áp bức bóc lột, bất công","Ách thống trị","Chủ nghĩa Đế quốc","Chủ nghĩa thực dân"],"a":"A"},{"id":"4-42","n":42,"t":"Kiên định mục tiêu độc lập dân tộc và CNXH trên nền tảng chủ nghĩa Mác-Lênin và tư tưởng Hồ Chí Minh là:","o":["Nhiệm vụ trọng tâm","Bài học lớn","Mục tiêu lớn","Quan trọng"],"a":"B"},{"id":"4-43","n":43,"t":"Chọn phương án trả lời đúng. Việt Nam quá độ lên CNXH bỏ qua chế độ Tư bản chủ nghĩa là một tất yếu vì:","o":["Có các nước thành công đi trước giúp đỡ","Có Đảng cộng sản tiên phong","Nó phù hợp với đặc điểm của đất nước và xu thế phát triển của thời đại","Sự phát triển của lực lượng sản xuất"],"a":"C"},{"id":"4-44","n":44,"t":"Chọn phương án trả lời đúng. Cách mạng Tháng mười Nga năm 1917 đã mở ra:","o":["Thời kỳ lịch sử","Kỷ nguyên độc lập","Thời đại quá độ lên chủ nghĩa xã hội trên phạm vi toàn thế giới","Thời kỳ đấu tranh quyết liệt"],"a":"C"}]},{"id":"5","name":"Bài 5","title":"PHÁT TRIỂN KINH TẾ, XÃ HỘI, VĂN HÓA, CON NGƯỜI Ở VN","q":[{"id":"5-1","n":1,"t":"Chọn phương án trả lời đúng nhất. Công nghiệp hóa – hiện đại hóa là:","o":["Kết hợp con người với máy móc","Kết hợp sản xuất quy mô khép kín và có máy móc hỗ trợ","Sự chuyển đổi từ nền sản xuất nhỏ sang nền sản xuất lớn, hiện đại","Quy mô sản xuất lớn"],"a":"C"},{"id":"5-2","n":2,"t":"Chọn phương án trả lời đúng nhất. Kinh tế thị trường là:","o":["Nền kinh tế sản xuất theo hướng thủ công","Nền kinh tế sản xuất nhỏ","Nền kinh tế có nhiều sản phẩm của lao động, phục vụ cho đời sống trong nước","Nền kinh tế hàng hóa nhiều thành phần"],"a":"D"},{"id":"5-3","n":3,"t":"Xây dựng Đảng trong sạch, vững mạnh là một trong những phương hướng quan trọng nhằm lãnh đạo nhân dân ta:","o":["Bằng cương lĩnh, chiến lược","Bằng các định hướng về chính sách, chủ trương","Bằng tuyên truyền, thuyết phục, nêu gương","Bằng cương lĩnh, chủ trương, tuyên truyền và nêu gương"],"a":"D"},{"id":"5-4","n":4,"t":"Có mấy quan điểm phát triển kinh tế - xã hội ở Việt Nam hiện nay?","o":["5 quan điểm","6 quan điểm","7 quan điểm","8 quan điểm"],"a":"B"},{"id":"5-5","n":5,"t":"Trong chế độ xã hội chủ nghĩa “Nước mạnh” được hiểu:","o":["Là đất nước dân chủ được thực hiện rộng rãi trên phạm vi cả nước, nhằm phát triển toàn diện các lĩnh vực trong đời sống xã hội.","Là một đất nứơc có tiềm lực ngang với các nước trong khu vực","Là đất nước phát triển toàn diện trên các lĩnh vực chính về kinh tế - chính trị","Là đất nước có tiềm lực lớn về kinh tế, phát triển bền vững; mạnh về sự ổn định chế độ chính trị; mạnh về văn hóa, tinh thần; mạnh về quốc phòng an ninh; mạnh về uy tín vị thế trong quan hệ quốc tế."],"a":"D"},{"id":"5-6","n":6,"t":"Để có một xã hội do nhân dân làm chủ cần:","o":["Xây dựng thiết chế xã hội chặt chẽ và nguyên tắc hoạt động thống nhất","Xây dựng nền dân chủ xã hội chủ nghĩa","Xây dựng nền dân chủ tư bản chủ nghĩa","Hoàn thiện các thiết chế văn hóa"],"a":"A"},{"id":"5-7","n":7,"t":"Một trong những quan điểm phát triển kinh tế - xã hội ở Việt Nam là:","o":["Phát triển thế mạnh vốn có của Việt Nam","Phát triển hiệu quả kinh tế - xã hội trong tương lai","Phát triển bền vững là yêu cầu cơ bản của đất nước","Phát triển đồng bộ các yếu tố thị trường và các loại thị trường"],"a":"D"},{"id":"5-8","n":8,"t":"Một trong những quan điểm phát triển kinh tế - xã hội ở Việt Nam là:","o":["Phát triển mạnh lực lượng sản xuất","Phát triển khoa học công nghệ ngày càng hiện đại","Đẩy mạnh công nghiệp hóa, hiện đại hóa, phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại","Hoàn thiện các văn bản luật phù hợp với lực lượng sản xuất và khoa học công nghệ để phát triển kinh tế thị trường bền vững"],"a":"C"},{"id":"5-9","n":9,"t":"Một trong những nội dung lớn phát triển kinh tế - xã hội ở Việt Nam là:","o":["Phát triển kinh tế thị trường theo chiều sâu","Phát triển kinh tế thị trường chú trọng công nghiệp nặng","Phát triển kinh tế thị trường xã hội chủ nghĩa","Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa"],"a":"D"},{"id":"5-10","n":10,"t":"Một trong những nội dung lớn phát triển kinh tế - xã hội ở Việt Nam là:","o":["Coi trọng phát triển nông nghiệp","Coi trọng phát triển công nghiệp","Có chính sách xã hội đúng đắn, công bằng vì con người","Chú trọng đầu tư vào lực lượng sản xuất đặc biệt là người lao động"],"a":"C"},{"id":"5-11","n":11,"t":"Một trong những nội dung lớn phát triển kinh tế - xã hội ở Việt Nam là:","o":["Chú trọng vào giải quyết vấn đề chính sách giáo dục – khoa học công nghệ","Chú trọng vào ưu tiên cho con người phát triển toàn diện","Hoàn thiện các văn bản luật liên quan đến phát triển con người toàn diện","Tăng trưởng kinh tế gắn với tiến bộ và công bằng xã hội"],"a":"D"},{"id":"5-12","n":12,"t":"Đảng ta đưa ra mấy quan điểm về phát triển văn hóa, con người Việt Nam trong giai đoạn hiện nay?","o":["5 quan điểm","6 quan điểm","7 quan điểm","8 quan điểm"],"a":"A"},{"id":"5-13","n":13,"t":"Theo quan điểm phát triển văn hóa, con người, vị trí của văn hóa so với kinh tế, chính trị được xác định là:","o":["Có trước kinh tế, chính trị","Có sau kinh tế, chính trị","Tách rời độc lập với nhau","Ngang hàng với kinh tế, chính trị"],"a":"D"},{"id":"5-14","n":14,"t":"Để hoàn thành được quan điểm về phát triển văn hóa, con người, cần chú trọng vào:","o":["Hệ thống chính trị","Bộ máy nhà nước","Thể chế","Con người"],"a":"D"},{"id":"5-15","n":15,"t":"Theo nội dung phát triển văn hóa, con người thì con người vừa là trung tâm vừa là:","o":["Vốn","Năng xuất","Chủ thể","Hàng hóa"],"a":"C"},{"id":"5-16","n":16,"t":"Theo nội dung phát triển văn hóa, con người: trung tâm của chiến lược phát triển văn hóa: Giáo dục đào tạo có sứ mệnh:","o":["Nâng cao dân trí, bồi dưỡng nhân tài","Phát triển nguồn nhân lực, nâng cao dân trí","Bồi dưỡng nhân tài, phát triển nguồn nhân lực","Nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài"],"a":"D"},{"id":"5-17","n":17,"t":"Thực chất của công nghiệp hóa, hiện đại hóa nền kinh tế quốc dân ở nước ta là:","o":["Xây dựng và chuyển dịch cơ cấu kinh tế theo hướng hiện đại","Phát triển khoa học công nghệ của nền kinh tế đất nước","Trang bị khoa học kỹ thuật cho các thành phần kinh tế","Xây dựng cơ sở vật chất, kỹ thuật của chủ nghĩa xã hội"],"a":"D"},{"id":"5-18","n":18,"t":"Các sản phẩm khoa học công nghệ được mua bán thuận lợi trên thị trường là nhờ có sự phát triển của:","o":["Thị trường công cụ lao động","Thị trường máy móc","Thị trường thiết bị","Thị trường khoa học công nghệ"],"a":"D"},{"id":"5-19","n":19,"t":"Nghị quyết Trung ương lần thứ 5 khóa XII đã xác định những thành phần kinh tế nòng cốt để phát triển kinh tế là:","o":["Kinh tế nhà nước và kinh tế có vốn đầu tư nước ngoài","Kinh tế nhà nước, kinh tế tập thể và kinh tế tư nhân","Kinh tế tập thể; kinh tế tư nhân; kinh tế có vốn đầu tư nước ngoài","Kinh tế nhà nước; kinh tế có vốn đầu tư nước ngoài; kinh tế tư nhân"],"a":"B"},{"id":"5-20","n":20,"t":"Thể chế kinh tế mà Việt Nam đang xây dựng để đi lên CNXH là:","o":["Thể chế kinh tế hàng hóa nhiều thành phần","Thể chế kinh tế tự cung, tự cấp","Thể chế kinh tế thị trường XHCN","Thể chế kinh tế thị trường định hướng XHCN"],"a":"D"},{"id":"5-21","n":21,"t":"Một trong những nội dung phát triển văn hóa, con người ở Việt Nam là:","o":["Tăng cường sáng tạo, truyền bá, phổ biến những giá trị văn hóa thấm nhuần tinh thần dân tộc","Mở rộng kinh tế đối ngoại","Tăng trưởng kinh tế gắn với tiến bộ và công bằng xã hội","Nâng cao vai trò lãnh đạo của Đảng"],"a":"A"},{"id":"5-22","n":22,"t":"Yếu tố nào sau đây là trọng tâm để đưa nước ta thoát ra khỏi nghèo nàn và khắc phục nguy cơ tụt hậu xa hơn về kinh tế so với các nước trong khu vực và thế giới?","o":["Ổn định về chính trị","Tăng cường hợp tác quốc tế","Tăng cường sức mạnh quốc phòng an ninh","Phát triển kinh tế"],"a":"D"},{"id":"5-23","n":23,"t":"Ở Việt Nam, phát triển kinh tế thị trường nhằm mục tiêu cơ bản là:","o":["Ổn định và phát triển kinh tế","Ổn định chính trị và phát triển kinh tế","Nâng cao đời sống vật chất, tinh thần của nhân dân trong hoàn cảnh mới","Dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh"],"a":"D"},{"id":"5-24","n":24,"t":"Chọn phương án trả lời đúng nhất. Kinh tế thị trường phát triển được do yếu tố cơ bản là:","o":["Yếu tố cá nhân","Yếu tố văn hóa, tư tưởng","Yếu tố thị trường","Yếu tố tập thể"],"a":"C"},{"id":"5-25","n":25,"t":"Chọn phương án trả lời đúng nhất. Văn hóa được hiểu là:","o":["Là yếu tố tinh thần của con người","Là yếu tố vật chất của con người","Là nền tảng cơ bản và quan trọng của con người , tạo nên nét riêng biệt","Toàn bộ đời sống vật chất và đời sống tinh thần của con người"],"a":"D"},{"id":"5-26","n":26,"t":"Chọn phương án trả lời đúng nhất.Văn hóa có mấy chức năng cơ bản?","o":["2 chức năng","3 chức năng","4 chức năng","5 chức năng"],"a":"C"},{"id":"5-27","n":27,"t":"Một trong những giải pháp cơ bản phát triển văn hóa, con người Việt Nam hiện nay là:","o":["Nâng cao thể lực tầm vóc con người Việt Nam phát triển toàn diện","Xây dựng phát huy lối sống phù hợp","Chủ động hội nhập quốc tế về văn hóa, tiếp thu tinh hoa văn hóa nhân loại","Chăm lo xây dựng con người Việt Nam"],"a":"D"},{"id":"5-28","n":28,"t":"Một trong những giải pháp cơ bản phát triển văn hóa, con người Việt Nam hiện nay là:","o":["Tạo cơ hội việc làm cho người lao động Việt Nam","Tiếp tục hoàn thiện chính sách an ninh","Đổi mới chính sách giảm nghèo cho người lao động","Xây dựng con người Việt Nam phát triển toàn diện"],"a":"D"},{"id":"5-29","n":29,"t":"Một trong những giải pháp cơ bản phát triển văn hóa, con người Việt Nam hiện nay là:","o":["Coi trọng và đảm bảo nâng cao sức khỏe nhân dân","Huy động các nguồn lực tiếp tục xây dựng, phát triển hệ thống bệnh viện","Nâng cao nhận thức thức về kinh tế thị trường","Xây dựng môi trường văn hóa lành mạnh"],"a":"D"},{"id":"5-30","n":30,"t":"Một trong những giải pháp cơ bản phát triển văn hóa, con người Việt Nam hiện nay là:","o":["Xây dựng văn hóa trong chính trị và kinh tế","Tạo ra các sản phẩm tinh thần có giá trị","Tăng cường quốc phòng an ninh trong nước và quốc tế","Coi trọng và đảm bảo nâng cao sức khỏe nhân dân"],"a":"B"},{"id":"5-31","n":31,"t":"Một trong những giải pháp cơ bản phát triển văn hóa, con người Việt Nam hiện nay là:","o":["Đẩy mạnh phát triển các khu công nghiệp, dịch vụ","Tăng cường đảm bảo sức khỏe nhân dân","Tạo cơ hội việc làm cho người lao động","Nâng cao chất lượng, hiệu quả hoạt động văn hóa"],"a":"D"},{"id":"5-32","n":32,"t":"Người khởi thảo ra “Đề cương văn hóa Việt Nam” là:","o":["Trường Chinh","Trần Phú","Lê Hồng Phong","Nguyễn Văn Cừ"],"a":"A"},{"id":"5-33","n":33,"t":"Chọn phương án trả lời đúng nhất. “Đề cương văn hóa Việt Nam” ra đời năm:","o":["1940","1941","1942","1943"],"a":"D"},{"id":"5-34","n":34,"t":"Trong các giá trị văn hóa truyền thống tốt đẹp của dân tộc Việt Nam, giá trị giữ vị trí quan trọng nhất là:","o":["Đoàn kết","Anh hùng, bất khuất","Cần cù, sáng tạo, nhân ái, nghĩa tình, khoan dung..","Yêu nước"],"a":"D"},{"id":"5-35","n":35,"t":"Văn kiện Đảng xác định văn hóa là một trong ba mặt trận quan trọng là:","o":["Nghị quyết Trung ương 5 khóa VIII","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ","Bản “Đề cương văn hóa Việt Nam”","Văn kiện Đại hội hội I năm 1935"],"a":"C"},{"id":"5-36","n":36,"t":"“Vì lẽ sinh tồn cũng như mục đích của cuộc sống, loài người mới sáng tạo ra và phát minh ra ngôn ngữ, chữ viết, đạo đức, pháp luật, tôn giáo, văn học, nghệ thuật: những công cụ trong sinh hoạt hàng ngày về ăn mặc, ở và các phương thức sử dụng. toàn bộ những sáng tạo và phát minh đó tức là văn hóa” là:","o":["Trần Phú","Trường Chinh","Lê Hồng Phong","Hồ Chí Minh"],"a":"D"},{"id":"5-37","n":37,"t":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH (năm 1991) đã chỉ rõ một trong những đặc trưng của CNXH mà chúng ta xây dựng là:","o":["Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc","Có nền văn hóa phát triển cao dựa vào lực lượng sản xuất tiên tiến","Có nền văn hóa mang đậm truyền thống dân tộc","Có nền văn hóa giàu tính nhân văn cao cả"],"a":"A"},{"id":"5-38","n":38,"t":"Cốt lõi xây dựng nền văn hóa Việt Nam tiên tiến là:","o":["Tiếp thu thành tựu văn hóa khoa học – kỹ thuật của các nước trên thế giới làm nền tảng cho công cuộc xây dựng văn hóa hiệu quả","Tiếp thu tư tưởng tinh hoa văn hóa nhân loại","Bài trừ các tư tưởng phản cách mạng","Có lý tưởng độc lập dân tộc và chủ nghĩa xã hội theo Chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh"],"a":"D"},{"id":"5-39","n":39,"t":"Chọn phương án trả lời đúng nhất. Chính sách xã hội nhằm hướng tới lĩnh vực:","o":["Văn hóa","Chính trị","Kinh tế","Xã hội"],"a":"D"},{"id":"5-40","n":40,"t":"Cần bồi dưỡng các giá trị văn hóa trong thanh niên, học sinh, sinh viên là:","o":["Lý tưởng sống","Lý tưởng mục tiêu, lối sống, đạo đức","Lý tưởng sống, lối sống, năng lực, trí tuệ, đạo đức và bản lĩnh văn hóa con người Việt Nam","Năng lực, trí tuệ và con người Việt Nam trong bối cảnh hội nhập kinh tế quốc tế và thu hút vốn đầu tư nước ngoài vào Việt Nam"],"a":"C"},{"id":"5-41","n":41,"t":"Đảng khẳng định nhân tố quyết định sự phát triển là:","o":["Vốn","Hàng hóa","Khoa học công nghệ","Con người"],"a":"D"},{"id":"5-42","n":42,"t":"Đảng ta tiến hành cách mạng xã hội nhằm mục đích cao nhất là:","o":["Giải phóng dân tộc","Giải phòng dân tộc, giải phóng xã hội và giải phóng con người","Giải phóng giai cấp, giải quyết các mâu thuẫn vốn có trong nước để giành độc lập cho dân tộc","Giải phóng xã hội và tiến lên Chủ nghĩa cộng sản văn minh"],"a":"B"},{"id":"5-43","n":43,"t":"Khái niệm chính sách xã hội được Đảng ta chính thức đề cập và đưa vào văn kiện từ Đại hội:","o":["Đại hội VI (1986)","Đại hội VII (1991)","Đại hội VIII (1996)","Đại hội IX (2001)"],"a":"A"},{"id":"5-44","n":44,"t":"Quan điểm “Việt Nam muốn làm bạn với các nước dân chủ không gây thù oán với một ai” là:","o":["Lê Duẩn","Võ Nguyên Giáp","Hồ Chí Minh","Phạn Văn Đồng"],"a":"C"},{"id":"5-45","n":45,"t":"Trong các nội dung chủ yếu sau đây của đấu tranh giai cấp ở nước ta hiện nay, theo quan điểm của Đại hội IX của Đảng nội dung chủ yếu nhất là:","o":["Làm thất bại âm mưu Diễn biến hòa bình","Đấu tranh chống tệ nạn xã hội và các thế lực thù địch","Chống áp bức bất công, thực hiện công bằng xã hội","Thực hiên thắng lợi sự nghiệp công nghiệp hóa, hiện đại hóa đất nước"],"a":"D"},{"id":"5-46","n":46,"t":"“ Yêu Tổ quốc: cái gì trái với quyền lợi của Tổ quốc, chúng ta kiên quyết chống lại. Yêu nhân dân: việc gì hay người nào phạm đến lợi ích chung của nhân dân, chúng ta kiên quyết chống lại. Yêu lao động: ai khinh rẻ lao động, chúng ta kiên quyết chống lại. Yêu khoa học: cái gì trái với khoa học, chúng ta kiên quyết chống lại. Yêu đạo đức: chúng ta phải thực hiện đức tính trong sạch, chất phác, hăng hái, cần kiệm; xoá bỏ hết những vết tích nô lệ trong tư tưởng và hành động”’ là của:","o":["Hồ Chí Minh","Võ Nguyên Giáp","Các Mác","Ăng ghen"],"a":"A"},{"id":"5-47","n":47,"t":"“Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân.” Là của :","o":["Hồ Chí Minh","Võ Nguyên Giáp","Các Mác","Ăng ghen"],"a":"A"},{"id":"5-48","n":48,"t":"“Bảo đảm sự lãnh đạo thống nhất của Đảng, sự quản lý tập trung của Nhà nước đối với các hoạt động đối ngoại. Phối hợp chặt chẽ hoạt động đối ngoại của Đảng, ngoại giao Nhà nước và đối ngoại nhân dân; giữa ngoại giao chính trị với ngoại giao kinh tế và ngoại giao văn hóa; giữa đối ngoại với quốc phòng, an ninh.” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"D"}]},{"id":"6","name":"Bài 6","title":"TĂNG CƯỜNG QUỐC PHÒNG AN NINH, MỞ RỘNG QUAN HỆ ĐỐI NGOẠI VÀ HỘI NHẬP QUỐC TẾ Ở NƯỚC TA HIỆN NAY","q":[{"id":"6-1","n":1,"t":"Một trong những vấn đề toàn cầu hiện nay là:","o":["An ninh lương thực","Bạo lực gia đình","Phân biệt giới tính","Sống ảo"],"a":"A"},{"id":"6-2","n":2,"t":"Một trong những vấn đề toàn cầu hiện nay là:","o":["Biến đổi khí hậu","Bạo lực mạng","Tranh chấp tài nguyên, khoáng sản","Phân biệt giới tính"],"a":"A"},{"id":"6-3","n":3,"t":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","o":["Tụt hậu về kinh tế","Di cư tự do","Cạn kiệt nguồn tài nguyên khoáng sản","An ninh phi truyền thống"],"a":"A"},{"id":"6-4","n":4,"t":"Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra mấy nguy cơ đang tồn tại với cách mạng Việt Nam hiện nay?","o":["01 nguy cơ","02 nguy cơ","03 nguy cơ","04 nguy cơ"],"a":"D"},{"id":"6-5","n":5,"t":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","o":["“Diễn biến hòa bình” của các thế lực thù địch","Nguy cơ an ninh lương thực","Nguy cơ dịch bệnh","Nguy cơ thiên tai"],"a":"A"},{"id":"6-6","n":6,"t":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","o":["Nguy cơ chiến tranh, xâm phạm chủ quyền độc lập dân tộC.","Nguy cơ an ninh phi truyền thống ảnh hưởng đến sự phát triển tiến lên chủ nghĩa xã hội","Nguy cơ an ninh truyền thống ảnh hưởng đến sự nghiệp phát triển tiến lên chủ nghĩa xã hội của Việt Nam","Chệch hướng xã hội chủ nghĩa"],"a":"D"},{"id":"6-7","n":7,"t":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","o":["Tham nhũng và các tệ nạn xã hội","Nguy cơ chiến tranh xâm lược","Nguy cơ khan hiếm lương thực","Nguy cơ khủng bố"],"a":"A"},{"id":"6-8","n":8,"t":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","o":["Chăm lo nâng cao phẩm chất cách mạng, trình độ chính trị, chuyên môn, nghiệp vụ cho cán bộ, chiến sĩ.","Giữ vững và tăng cường sự lãnh đạo của Đảng, hiệu lực quản lý của Nhà nước đối với sự nghiệp bảo vệ Tổ quốc","Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội là nhiệm vụ trọng yếu.","Quan hệ đối ngoại được mở rộng nhằm tăng cường mở rộng mối quan hệ trong quốc phòng, an ninh."],"a":"B"},{"id":"6-9","n":9,"t":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","o":["Kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội","Kiên định mục tiêu dân giàu, nước mạnh, xã hội công bằng, văn minh","Kiên định hội nhập kinh tế quốc tế trong tình hình mới","Toàn quân dân Việt Nam đoàn kết để xây dựng nền quốc phòng toàn dân"],"a":"A"},{"id":"6-10","n":10,"t":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","o":["Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội.","Xây dựng thế trận quốc phòng toàn dân, kết hợp chặt chẽ với thế trận an ninh nhân dân vững chắC.","Kết hợp sức mạnh dân tộc với sức mạnh thời đại, tranh thủ sự ủng hộ của bạn bè quốc tế","Phát triển kinh tế - xã hội đi đôi với tăng cường sức mạnh quốc phòng – an ninh."],"a":"C"},{"id":"6-11","n":11,"t":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","o":["Phát huy cao nhất sức mạnh tổng hợp của đất nước, nhất là vai trò của nhân dân đối với sự nghiệp bảo vệ Tổ quốc","Đổi mới, hoàn thiện thể chế để tăng cường quốc phòng, an ninh trong tình hình mới","Chủ động mở rộng hợp tác về quốc phòng an ninh với các nước trên thế giới","Chủ động đón nhận cơ hội phát triển để tăng cường quốc phòng, an ninh trong tình hình mới."],"a":"A"},{"id":"6-12","n":12,"t":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","o":["Giữ vững kỷ cương tăng cường pháp chế","Tạo được chuyển biến rõ rệt, khắc phục được những hạn chế, yếu kém trong công tác xây dựng Đảng, xây dựng Nhà nướC.","Củng cố và hoàn thiện khối liên minh công nông tri thức","Giữ gìn bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trước những mối đe doạ bên trong và bên ngoài"],"a":"B"},{"id":"6-13","n":13,"t":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","o":["Hợp tác quân sự với các nước xã hội chủ nghĩa trên thế giới","Quan hệ quốc tế sâu rộng để tăng cường quốc phòng an ninh","Chính trị - xã hội ổn định, dân chủ, kỷ cương, đồng thuận được củng cố; đời sống vật chất và tinh thần của nhân dân được nâng lên rõ rệt","Học hỏi kinh nghiệm quân sự của tất cả các nước trên thế giới"],"a":"C"},{"id":"6-14","n":14,"t":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","o":["Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa là mục tiêu chiến lước của quốc phòng, an ninh ở nước ta hiện nay","Đấu tranh bảo vệ Tổ quốc xã hội chủ nghĩa Việt Nam là mục tiêu hàng đầu của quốc phòng, an ninh nhân dân.","Chống lại những quan điểm sai trái chống phá Nhà nước","Tập trung phát triển các ngành công nghiệp cơ bản, tạo nền tảng cho công nghiệp hoá, hiện đại hoá, cho công nghiệp quốc phòng, an ninh."],"a":"A"},{"id":"6-15","n":15,"t":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","o":["Khác phục được tình trạng sơ hở, mất cảnh giác; ngăn ngừa làm thất bại âm mưu, hoạt động chống phá của các thế lực thù địch","Hoàn thiện chức năng, nhiệm vụ và cơ cấu tổ chức cảu lực lượng Công an nhân dân, đáp ứng yêu cầu, nhiệm vụ bảo vệ Tổ quốc trong tình hình mới.","Chú trọng xây dựng lực lượng dân quân tự vệ vững mạnh, rộng khắp, lực lượng dự bị động viên hùng hậu, có chất lượng cao.","Xây dựng sức mạnh quân sự phải coi trọng nhiều yếu tố; trong đó, xây dựng lực lượng vũ trang gồm Quân đội nhân dân và Công an nhân dân vững mạnh"],"a":"D"},{"id":"6-16","n":16,"t":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","o":["Kinh tế được để cao để gia tăng tiềm lực cho quốc phòng, an ninh","Bảo đảm an ninh trên các lĩnh vực, kiềm chế gia tăng tội phạm, tạo chuyển biến rõ rệt về trật tự an toàn xã hội","Văn hóa – xã hội đóng vai trò quan trọng trong việc tuyên truyền nhân trong thực hiện đường lối quốc phòng, an ninh","Giáo dục nhân dân thực hiện nghiêm túc đường lối quốc phòng, an ninh nhân dân"],"a":"B"},{"id":"6-17","n":17,"t":"Đại hội đại biểu toàn quốc lần thứ XII của Đảng (1/2016) khẳng định phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay là gì?","o":["Xây dựng, củng cố đường biên giới trên bộ hoà bình, hữu nghị, hợp tác và phát triển","Xây dựng khối liên minh công - nông - tri thức","Hợp tác, bình đẳng, đa phương hoá, đa dạng hoá trong các quan hệ về quốc phòng, an ninh","Đôi bên cùng có lợi, thực hiện hợp tác về quốc phòng, anh ninh."],"a":"A"},{"id":"6-18","n":18,"t":"Đâu là một trong những phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay mà Đảng ta đã chỉ ra tại Đại hội đại biểu toàn quốc lần thứ XII (1/2016)?","o":["Tăng cường tiềm lực quốc phòng và an ninh; xây dựng thế trận quốc phòng toàn dân, thế trận an ninh nhân dân vững chắC.","Thực hiện nhất quán đường lối đối ngoại độc lập, tự chủ, hoà bình, hợp tác và phát triển.","Bảo đảm an ninh trên các lĩnh vực, kìm chế gia tăng tội phạm, tạo chuyển biến rõ rệt về trật tự an toàn xã hội.","Tập trung phát triển các ngành khoa học cơ bản"],"a":"A"},{"id":"6-19","n":19,"t":"Đâu là một trong những phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay mà Đảng ta đã chỉ ra tại Đại hội đại biểu toàn quốc lần thứ XII (1/2016)?","o":["Xây dựng “thế trận lòng dân”, tạo nền tảng vững chắc xây dựng nền quốc phòng toàn dân và nền an ninh nhân dân.","Mục tiêu, nhiệm vụ của quốc phòng, an ninh là bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tô quốC.","Chủ động, ngăn chặn, làm thất bại mọi âm mưu và hành động chống phá của các thế lực thù địch.","Sự ổn định và phát triển bền vững mọi mặt đời sống kinh tế - xã hội là nền tảng vững chắc của quốc phòng – an ninh."],"a":"D"},{"id":"6-20","n":20,"t":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","o":["Triển khai mạnh mẽ định hướng chiến lược chủ động và tích cực hội nhập quốc tế","Hội nhập quốc tế là sự nghiệp của toàn dân và của cả hệ thống chính trị dưới sự lãnh đạo của Đảng","Hội nhập quốc tế là quá trình vừa hợp tác vừa đấu tranh","Nghiêm chỉnh tuân thủ các cam kết quốc tế mà Việt Nam tham giA."],"a":"A"},{"id":"6-21","n":21,"t":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","o":["Chủ động tạo ra mối quan hệ quốc tế thuận lợi để đưa đất nước ta hội nhập","Chú trọng phát triển quan hệ hợp tác, hữu nghị, truyền thông với các nước láng giềng, thúc đẩy quan hệ với các đối tác lớn, đối tác quan trọng.","Đẩy mạnh hoạt động kinh tế đối ngoại đa phương hoá, đa dạng hoá quan hệ đối ngoại với các nước xã hội chủ nghĩA.","Tích cực hội nhập kinh tế quốc tế mở rộng giao lưu kinh tế với tất cả các quốc gia trên thế giới."],"a":"B"},{"id":"6-22","n":22,"t":"“ Là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế”. Đây là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện nào?","o":["Đại hội X","Đại hội XI","Đại hội XII","Đại hội XIII"],"a":"C"},{"id":"6-23","n":23,"t":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","o":["Tích cực tham gia các diễn đàn và hoạt động của thế giới","Sẵn sàng đối thoại với các nước về vấn đề kinh tế","Mở rộng hợp tác về kinh tế","Chủ động và tích cực hội nhập quốc tế"],"a":"D"},{"id":"6-24","n":24,"t":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","o":["Đa phương hóa, đa dạng hóa trong quan hệ đối ngoại","Nâng cao vị thế của nước ta trên thế giới","Tích cực tham gia các diễn đàn về kinh tế trên thế giới","Mở rộng hợp tác kinh tế với các quốc gia trên thế giới"],"a":"A"},{"id":"6-25","n":25,"t":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","o":["Chủ động tạo ra mối quan hệ quốc tế thuận lợi để đưa đất nước ta hội nhập với thế giới","Bảo đảm sự lãnh đạo thống nhất của Đảng, sự quản lý tập trung của Nhà nước đối với các hoạt động đối ngoại.","Nêu cao tinh thần, tự chủ trong quan hệ đối ngoại","Nêu cao tinh thần, tự chủ trong quan hệ ngoại giao"],"a":"B"},{"id":"6-26","n":26,"t":"Việt Nam trở thành thành viên chính thức của Diễn đàn Hợp tác Kinh tế châu Á – Thái Bình Dương ( APFC) năm nào?","o":["1996","1997","1998","1999"],"a":"C"},{"id":"6-27","n":27,"t":"Với công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn gọi nhập ngũ thì độ tuổi hết nghĩa vụ quân sự là bao nhiêu?","o":["25 tuổi","26 tuổi","27 tuổi","28 tuổi"],"a":"C"},{"id":"6-28","n":28,"t":"WTO là tên viết tắt của tổ chức nào dưới đây ?","o":["Tổ chức Lương thực và Nông nghiệp Liên hợp quốc","Tổ chức Thương mại Thế giới","Tổ chức Y tế Thế giới","Tổ chức các nước xuất khẩu dầu mỏ"],"a":"B"},{"id":"6-29","n":29,"t":"Việt Nam bình thường hóa quan hệ ngoại giao với Mĩ năm nào?","o":["1990","1995","1997","2000"],"a":"B"},{"id":"6-30","n":30,"t":"Anh B tích cực tham gia hoạt động bảo vệ an ninh tại nơi cư trú. Điều này thể hiện trách nhiệm nào dưới đây của công dân?","o":["Nêu cao tinh thần cảnh giác trước mọi thủ đoạn của kẻ thù","Xây dựng khối đại đoàn kết toàn dân","Sẵn sàng thực hiện nghĩa vụ quân sự","Sẵn sàng tham gia các hoạt động an ninh và quốc phòng"],"a":"D"},{"id":"6-31","n":31,"t":"Ông A là cán bộ xã nhưng ông lại không muốn con trai mình phải thực hiện đăng kí nghĩa vụ quân sự. Nếu là người thân trong gia đình ông A, em sẽ khuyên ông A như thế nào?","o":["Chấp hành Luật Nghĩa vụ quân sự","Nên cho con đi học để không phải tham gia nghĩa vụ quân sự","Gặp ban chỉ huy quân sự huyện giúp đỡ","Không đăng kí nghĩa vụ quân sự"],"a":"A"},{"id":"6-32","n":32,"t":"Anh trai của T có giấy gọi nhập ngũ, nhưng bố mẹ của T không muốn con đi bộ đội nên đã bàn với nhau tìm cách xin cho anh ở lại. Biết được điều này, T nên ứng xử theo cách nào dưới đây để thực hiện trách nhiệm công dân của mình?","o":["Coi như không biết vì đây là việc của bố mẹ","Nói chuyện với bố mẹ để bố mẹ hiểu được trách nhiệm bảo vệ Tổ quốc của công dân","Đồng ý với việc làm đó của bố mẹ","Tìm cách ngăn cản việc làm của bố mẹ"],"a":"B"},{"id":"6-33","n":33,"t":"Anh A có hành vi câu kết với người nước ngoài, phát tán tài liệu nói xấu Nhà nước. Hành vi của anh A là gì?","o":["Phản bội Tổ quốc","Lật đổ chính quyền nhân dân","Xâm phạm an ninh quốc gia","Cung cấp bí mật Nhà nước cho nước ngoài"],"a":"C"},{"id":"6-34","n":34,"t":"Trong hội nhập quốc tế lĩnh vực trọng tâm là:","o":["Hội nhập văn hóa","Hội nhập kinh tế","Hội nhập chính trị","Hội nhập quốc phòng – anh ninh"],"a":"B"},{"id":"6-35","n":35,"t":"Độ tuổi bắt đầu thực hiện nghĩa vụ quân sự tại Việt Nam hiện nay là:","o":["18 tuổi","19 tuổi","20 tuổi","21 tuổi"],"a":"A"},{"id":"6-36","n":36,"t":"Việt Nam là thành viên của Hiệp hội các Quốc gia Đông Nam Á (ASEAN) vào năm nào?","o":["1994","1995","1996","1997"],"a":"B"},{"id":"6-37","n":37,"t":"Việt Nam là thành viên của Tổ chức thương mại thế giới (WTO) vào năm nào?","o":["2005","2006","2007","2008"],"a":"C"},{"id":"6-38","n":38,"t":"ASEAN là tên viết tắt của tổ chức nào dưới đây?","o":["Hiệp hội các Quốc gia Đông Nam Á","Diễn đàn hợp tác Á – Âu","Tổ chức Y tế thế giới","Tổ chức các nước xuất khẩu dầu mỏ"],"a":"A"},{"id":"6-39","n":39,"t":"Tổ chức Y tế thế giới (WHO) được thành lập vào năm nào?","o":["1946","1947","1948","1949"],"a":"C"},{"id":"6-40","n":40,"t":"WHO là tên viết tắt của tổ chức nào dưới đây?","o":["Tổ chức Lương thực và Nông nghiệp Liên hợp quốc","Tổ chức phát triển công nghiệp của Liên hợp quốc","Tổ chức Y tế thế giới?","Tổ chức Khí tượng thế giới"],"a":"C"}]},{"id":"7","name":"Bài 7","title":"XÂY DỰNG VÀ HOÀN THIỆN NHÀ NƯỚC PHÁP QUYỀN XÃ HỘI CHỦ NGHĨA VIỆT NAM","q":[{"id":"7-1","n":1,"t":"Nhà nước cộng hòa xã hội chủ nghĩa Việt Nam mang bản chất của giai cấp?","o":["Vô sản","Nông dân","Công nhân","Tư sản"],"a":"C"},{"id":"7-2","n":2,"t":"Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam có mấy đặc trưng cơ b g","Nhà nước ta là nhà nước của các dân tộc","Mỗi dân tộc có bản sắc riêng và lối sống riêng","Nhà nước chăm lo lợi ích mọi mặt cho các dân tộc ở Việt Nam"],"a":"D"},{"id":"7-25","n":25,"t":"Chọn phương án trả lời đúng. Tính nhân dân của Nhà nước được thể hiện?","o":["Nhà nước là nhà nước của dân, do dân, vì dân","Nhà nước chăm lo lợi ích mọi mặt cho các dân tộc ở Việt Nam","Đời sống nhân dân ngày càng tốt hơn","Nhân dân tích cực lao động vì sự phát triển của đất nước"],"a":"A"},{"id":"7-26","n":26,"t":"Chọn phương án trả lời đúng. Nhà nước pháp quyền có nghĩa là mọi hoạt động của các cơ quan nhà nước, các tổ chức chính trị - xã hội và mọi công dân đều được thực hiện trên cơ sở?","o":["Chính sách","Dư luận xã hội","Niềm tin","Pháp luật"],"a":"D"},{"id":"7-27","n":27,"t":"Nhà nước thể hiện ý chí, lợi ích và nguyện vọng của nhân dân là nói đến đặc điểm gì?","o":["Tính xã hội","Tính nhân dân","Tính con người","Tính giai cấp"],"a":"B"},{"id":"7-28","n":28,"t":"Chọn phương án trả lời đúng nhất. Công cụ hữu hiệu nhất để Nhà nước quản lý xã hội?","o":["Kế hoạch","Chính sách","Chiến lược","Pháp luật"],"a":"D"},{"id":"7-29","n":29,"t":"Chọn phương án trả lời đúng nhất. Nhà nước xuất hiện khi?","o":["Có nhiều của cải trong xã hội","Xuất hiện chế độ tư hữu","Con người xuất hiện","Mâu thuẫn giai cấp không thể điều hòa được"],"a":"D"},{"id":"7-30","n":30,"t":"Nhà nước có mấy chức năng cơ bản?","o":["01 chức năng","02 chức năng","03 chức năng","04 chức năng"],"a":"B"},{"id":"7-31","n":31,"t":"Chọn phương án trả lời đúng. Nhà nước có các chức năng cơ bản?","o":["Chức năng đối ngoại và thu hút vốn đầu tư","Chức năng đối nội và ổn định trong nước","Chức năng giải quyết mâu thuẫn","Chức năng đối nội và chức năng đối ngoại"],"a":"D"},{"id":"7-32","n":32,"t":"Chọn phương án trả lời đúng nhất. Nhà nước pháp quyền XHCN quản lý mọi mặt của đời sống xã hội chủ yếu bằng?","o":["Chính sách","Tuyên truyền, giáo dục","Hiến pháp, pháp luật","Quy định"],"a":"C"},{"id":"7-33","n":33,"t":"Chọn phương án trả lời đúng. Trong hệ thống chính trị nước ta, cơ quan hành pháp của Nhà nước ta là:","o":["Viện kiểm sát và tòa án nhân dân","Chính phủ","Quốc hội","Viện kiểm sát"],"a":"B"},{"id":"7-34","n":34,"t":"Chọn phương án trả lời đúng. Trong hệ thống chính trị nước ta, cơ quan lập pháp của Nhà nước ta là:","o":["Viện kiểm sát và tòa án nhân dân","Quốc hội","Viện kiểm sát","Chính phủ"],"a":"B"},{"id":"7-35","n":35,"t":"Chọn phương án trả lời đúng. Trong hệ thống chính trị nước ta, cơ quan tư pháp của Nhà nước ta là:","o":["Tòa án nhân dân","Quốc hội","Ủy ban nhân dân","Chính phủ"],"a":"A"}]},{"id":"8","name":"Bài 8","title":"PHÁT HUY SỨC MẠNH CỦA KHỐI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC TRONG XÂY DỰNG, BẢO VỆ TỔ QUỐC","q":[{"id":"8-1","n":1,"t":"Thực hiện đoàn kết dân tộc là một nội dung, một nhiệm vụ chiến lược của cách mạng xã hội chủ nghĩa và là một điều kiện tất yếu để thực hiện sứ mệnh lịch sử của giai cấp công nhân, là quan điểm của:","o":["Hồ Chí Minh","V.I.Lênin","Trường Chinh","Chủ nghĩa Mác – Lênin"],"a":"D"},{"id":"8-2","n":2,"t":"Chọn phương án trả lời đúng nhất.Theo tư tưởng Hồ Chí Minh, Đoàn kết:","o":["Là thắng lợi, là then chốt","Là thành công","Là chiến thắng","Là tạo ra sức mạnh lớn"],"a":"D"},{"id":"8-3","n":3,"t":"“Đại đoàn kết dân tộc trong sự nghiệp cách mạng gồm các nội dung chủ yếu: về vị trí, vai trò, về nội dung, hình thức, nguyên tắc, phương pháp đoàn kết dân tộc” Là quan điểm của:","o":["Hồ Chí Minh","V.I.Lênin","Trường Chinh","Chủ nghĩa Mác – Lênin"],"a":"A"},{"id":"8-4","n":4,"t":"“Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công”. là câu nói của:","o":["Hồ Chí Minh","V.I.Lênin","C. Mác","Ph.Ăng ghen"],"a":"A"},{"id":"8-5","n":5,"t":"Đoàn kết là điểm “mẹ”, điểm này mà thực hiện tốt thì đẻ ra con cháu đều tốt. là câu nói của:","o":["V.I.Lênin","C. Mác","Ph.Ăng ghen","Hồ Chí Minh"],"a":"D"},{"id":"8-6","n":6,"t":"“Đại đoàn kết toàn dân tộc là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quổc” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-7","n":7,"t":"“Mục đích chung đoàn kết toàn dân tộc: Nhằm phát huy mạnh mẽ mọi nguồn lực, mọi tiềm năng sáng tạo của nhân dân để xây dựng và bảo vệ Tổ quốc” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"D"},{"id":"8-8","n":8,"t":"“Lấy mục tiêu xây dựng một nước Việt Nam hòa bình, độc lập, thống nhất, toàn vẹn lãnh thổ, dân giàu, nước mạnh, dân chủ, công bằng, văn minh” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"D"},{"id":"8-9","n":9,"t":"“Mục đích chung đoàn kết toàn dân tộc: tôn trọng những điểm khác biệt không trái với lợi ích chung của quốc gia - dân tộc” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-10","n":10,"t":"Theo Văn kiện Đại hội lần thứ XII của Đảng (1-2016) một trong những phương hướng cơ bản để phát huy khối đại đoàn kết dân tộc là:","o":["Tiếp tục thể chế hóa và cụ thể hóa các quan điểm, đường lối, chủ trương, chính sách của Đảng về đại đoàn kết toàn dân tộc","Hoàn thiện và thực hiện có hiệu quả các cơ chế, chính sách về kinh tế thị trường để tạo cho nền kinh tế phát triển","Bảo đảm mọi người dân đều có quyền tham gia phát triển kinh tế","Hoàn thiện các thiết chế văn hóa"],"a":"A"},{"id":"8-11","n":11,"t":"Văn kiện Đại hội lần thứ XII của Đảng (1-2016) một trong những phương hướng để phát huy khối đại đoàn kết dân tộc là:","o":["Khắc phục những hạn chế, bảo đảm tác dụng, hiệu quả thực chất hoạt động giám sát, phản biện xã hội của Mặt trận Tổ quốc và các tổ chức chính trị - xã hôi","Tạo môi trường văn hóa lành mạnh để phát huy các giá trị truyền thống tốt đẹp của dân tộc","Bảo đảm mọi người dân đều có quyền tham gia phát triển văn hóa","Thực hiện tiến bộ và công bằng xã hội"],"a":"A"},{"id":"8-12","n":12,"t":"“Đại đoàn kết toàn dân tộc phải dựa trên cơ sở giải quyết hài hòa quan hệ lợi ích giữa các thành viên trong xã hội” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-13","n":13,"t":"“Đoàn kết trong Đảng là hạt nhân, là cơ sở vững chắc để xây dựng khối đại đoàn kết toàn dân tộC.” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-14","n":14,"t":"“Đại đoàn kết toàn dân tộc là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-15","n":15,"t":"“Động lực chủ yếu để phát triển đất nước là đại đoàn kết dân tộc trên cơ sở liên mimh giữa công nhân với nông dân và trí thức do Đảng lãnh đạo” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-16","n":16,"t":"“Đoàn kết là một truyền thống cực kỳ quý báu của Đảng ta và dân tA. Các đồng chí từ Trung ương đến các chi bộ cần phải giữ gìn sự đoàn kết nhất trí của Đảng như giữ gìn con ngươi của mắt mình”. Là câu nói của:","o":["Trường Chính","Võ Nguyên Giáp","Phạm Văn Đồng","Hồ Chí Minh"],"a":"D"},{"id":"8-17","n":17,"t":"Về phương pháp thực hiện đại đoàn kết: Hồ Chí Minh xác định:","o":["Nên quan tâm đến lợi ích của quần chúng","Chỉ nên giáo dục tâm lý, nguyện vọng chung","Coi trọng việc tuyên truyền, giáo dục, vận động quần chúng.","Bắt quần chúng tham gia vào một nhóm"],"a":"C"},{"id":"8-18","n":18,"t":"Một trong những nguyên nhân gây nên hạn chế trong công tác đoàn kết dân tộc là:","o":["Sức mạnh đại đoàn kết toàn dân tộc chưa được phát huy đầy đủ, có lúc, có nơi chưa phát huy được vai trò, sức mạnh của nhân dân.","Chủ trương, quan điểm của Đảng về Quốc phòng an ninh còn chưa được kịp thời thể chế hóa, hoặc đã thể chế hóa nhưng chưa được thực hiện nghiêm túC.","Hoạt động của Hội phụ nữ có lúc, có nơi chưa sâu sát các tầng lớp nhân dân và cơ sở, còn có biểu hiện hành chính hóa, chưa thiết thực, hiệu quả.","Các đoàn thể còn hoạt động theo phong trào"],"a":"A"},{"id":"8-19","n":19,"t":"Một trong những nguyên nhân gây nên hạn chế trong công tác đoàn kết dân tộc là:","o":["Chậm đổi mới nội dung, phương thức hoạt động của Mặt trận Tổ quốc và các đoàn thể nhân dân","Một bộ phận cán bộ, đảng viên, công chức, viên chức làm công tác đối ngoại chưa thật sự tôn trọng, lắng nghe ý kiến để giải quyết kịp thời, có hiệu quả những yêu cầu, nguyện vọng chính đáng của nhân dân.","Hệ thống pháp luật, cơ chế, chính sách để thể chế hóa đường lối, chủ trương, quan điểm của Đảng về Mặt trận Tổ quốc và các đoàn thể nhân dân về công tác đối ngoại còn thiếu và chưa đồng bộ.","Các đoàn thể chính trị còn hoạt động tự phát, theo phong trào"],"a":"A"},{"id":"8-20","n":20,"t":"Quan điểm của Đảng về đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển 2011) đã xác định:","o":["Bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau giữa các dân tộc, tạo mọi điều kiện để các dân tộc cùng phát triển, gắn bó mật thiết với sự phát triển chung của cộng đồng dân tộc Việt Nam","Giữ gìn và phát huy truyền thống yêu nước của các dân tộC. Chống tư tưởng trọng nam khinh nữ và chia rẽ bè phái","Các chính sách kinh tế - xã hội phải phù hợp như ưu tiên phát triển kinh tế trong nước và quốc tế nhằm thu hút vốn đầu tư nước ngoài vào Việt Nam","Đoàn kết trong mặt trận dân tộc thống nhất"],"a":"A"},{"id":"8-21","n":21,"t":"Quan điểm của Đảng về đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển 2011) đã xác định:","o":["Bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau","Chống tư tưởng kỳ thị và chia rẽ dân tộc","Giữ gìn và phát huy bản sắc văn hoá, ngôn ngữ, truyền thống tốt đẹp của các dân tộc","Hạn chế sự giao lưu về văn hóa giữa các dân tộc để tránh mất bản sắc riêng"],"a":"A"},{"id":"8-22","n":22,"t":"“Mặt trận Tổ quốc Việt Nam, các đoàn thể nhân dân có vai trò rất quan trọng trong sự nghiệp đại đoàn kết dân tộc; đại diện cho quyền và lợi ích hợp pháp của nhân dân” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"D"},{"id":"8-23","n":23,"t":"“Đại đoàn kết toàn dân tộc lấy mục tiêu giữ vững độc lập, thống nhất của Tổ quốc, vì dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh làm điểm tương đồng, xoá bỏ mặc cảm, định kiến, phân biệt đối xử về quá khứ, thành phần, giai cấp, xây dựng tinh thần cởi mở, tin cậy lẫn nhau, cùng hướng tới tương lai” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-24","n":24,"t":"Một trong những phương hướng phát huy sức mạnh đại đoàn kết dân tộc là:","o":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa trong mọi lĩnh vực của đời sống xã hội","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Chăm lo công tác xây dựng Đảng","Phát triển tầng lớp trí thức"],"a":"A"},{"id":"8-25","n":25,"t":"Một trong những phương hướng phát huy sức mạnh đại đoàn kết dân tộc là:","o":["Thường xuyên nâng cao giác ngộ về đại đoàn kết toàn dân tộc và cả hệ thống chính trị","Đấu tranh với mọi biểu hiện chống phá khối đại đoàn kết dân tộc","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Bám sát mục tiêu, yêu cầu, nhiệm vụ của cách mạng"],"a":"C"},{"id":"8-26","n":26,"t":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","o":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa trong mọi lĩnh vực của đời sống xã hội","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Bám sát mục tiêu, yêu cầu, nhiệm vụ của cách mạng"],"a":"D"},{"id":"8-27","n":27,"t":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","o":["Thường xuyên nâng cao giác ngộ về đại đoàn kết toàn dân tộc và cả hệ thống chính trị","Chăm lo công tác xây dựng Đảng","Phát triển tầng lớp trí thức","Xóa bỏ mặc cảm, định kiến quá khứ, thành phần giai cấp"],"a":"A"},{"id":"8-28","n":28,"t":"Về ứng xử trong xây dựng khối đại đoàn kết toàn dân tộc để tập hợp, đoàn kết mọi người vào mặt trận chung, tăng cường đồng thuận xã hội, cần:","o":["Xóa bỏ mặc cảm, định kiến về quá khứ, thành phần giai cấp","Chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc","Đề cao tinh thần dân tộc, truyền thống nhân nghĩa","Đề cao tinh thần dân tộc, xóa bỏ mặc cảm về quá khứ, thành phần giai cấp và chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc"],"a":"D"},{"id":"8-29","n":29,"t":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","o":["Đấu tranh với mọi biểu hiện chống phá khối đại đoàn kết dân tộc","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc","Đề cao tinh thần dân tộc, truyền thống nhân nghĩa"],"a":"A"},{"id":"8-30","n":30,"t":"Chọn phương án trả lời đúng nhất. Để thực hiện đại đoàn kết dân tộc, sinh viên cần:","o":["Tích cực phát huy các truyền thống quý báu của dân tộc nhất là tinh thần yêu nước, tinh thần đoàn kết","Chấp hành nghiêm các chủ trương của Đảng, chính sách pháp luật của nhà nước, đấu tranh với các hành vi chia rẽ khối đại đoàn kết toàn dân tộc, chống phá Đảng, nhà nước…","Tích cực học tập, lao động, rèn luyện đạo đức để trở thành người công dân tốt, người lao động tốt","Tích cực phát huy các truyền thống quý báu của dân tộc, chấp hành các chủ trương của Đảng, pháp luật của nhà nước và học tập, rèn luyện để trở thành người công dân tốt"],"a":"D"},{"id":"8-31","n":31,"t":"Có bao nhiêu giải pháp về phát huy sức mạnh đại đoàn kết toàn dân tộc hiện nay?","o":["01 giải pháp","02 giải pháp","03 giải pháp","04 giải pháp"],"a":"C"},{"id":"8-32","n":32,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp công nhân cần phải thực hiện nội dung nào sau đây?","o":["Đảng, nhà nước tiếp tục quan tâm giáo dục, đào tạo, bồi dưỡng, phát triển giai cấp công nhân cả về số lượng và chất lượng","Nâng cao đời sống vật chất, tinh thần cho người dân để mọi người có thể phát triển toàn diện","Bảo đảm mọi quyền lợi về phát triển kinh tế - xã hội cho người dân","Hoàn thiện các thiết chế văn hóa"],"a":"A"},{"id":"8-33","n":33,"t":"Chọn phương án trả lời đúng nhất. Cơ sở xây dựng khối đại đoàn kết dân tộc là:","o":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Đảm bảo hài hòa các lợi ích chính đáng, hợp pháp của các giai cấp, tầng lớp, các dân tộc","Tạo môi trường thuận lợi để các thành phần kinh tế phát triển"],"a":"C"},{"id":"8-34","n":34,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp nông dân cần:","o":["Xây dựng, phát huy vai trò của giai cấp nông dân, chủ thể của quá trình phát triển nông nghiệp, xây dựng nông thôn mới","Hỗ trợ cho hoạt động giáo dục phát triển","Tăng cường các dịch vụ trong đời sống xã hội","Hỗ trợ về vốn, khoa học kỹ thuật"],"a":"A"},{"id":"8-35","n":35,"t":"Chọn phương án trả lời đúng nhất. Vị trí của khối đại đoàn kết dân tộc là:","o":["Động lực của cách mạng","Vừa là chiến lược cơ bản lâu dài, vừa là vấn đề cấp bách của cách mạng","Mục tiêu của cách mạng","Nhiệm vụ của cách mạng"],"a":"B"},{"id":"8-36","n":36,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp công nhân cần:","o":["Bảo đảm việc làm, nâng cao thu nhập, cải thiện điều kiện làm việc, nhà ở, các công trình phúc lợi phục vụ cho công nhân","Bổ sung các chính sách, pháp luật về tiền lương, bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp","Cải thiện chất lượng cuộc sống của dân cư nông thôn","Nâng cao bản lĩnh chính trị, trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp, tác phong công nghiệp, kỷ luật lao động của công nhân"],"a":"D"},{"id":"8-37","n":37,"t":"Chọn phương án trả lời đúng nhất. Chủ thể xây dựng khối đại đoàn kết dân tộc là:","o":["Toàn thể dân tộc, của cả hệ thống chính trị mà hạt nhân lãnh đạo là Đảng cộng sản Việt Nam","Giai cấp công nhân","Giai cấp nông dân","Tầng lớp trí thức"],"a":"A"},{"id":"8-38","n":38,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc đối với đối với đội ngũ trí thức cần:","o":["Tôn trọng và phát huy tự do tư tưởng trong hoạt động nghiên cứu, sáng tạo.","Tôn trọng ý kiến của mọi người trong quá trình phát triển","Hoàn thiện các văn bản luật liên quan đến kinh tế thị trường để phát triển kinh tế","Hỗ trợ về vốn, khoa học kỹ thuật trong quá trình nghiên cứu"],"a":"A"},{"id":"8-39","n":39,"t":"Chọn phương án trả lời đúng nhất. Nguyên tắc đoàn kết dân tộc là:","o":["Giai cấp công và giai cấp nông dân","Dựa trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức do Đảng cộng sản Việt Nam lãnh đạo","Địa chủ và phong kiến","Giai cấp tư sản và tầng lớp trí thức"],"a":"B"},{"id":"8-40","n":40,"t":"Ứng xử trong xây dựng khối đại đoàn kết dân tộc là:","o":["Đề cao tinh thần dân tộc, xóa bỏ mặc cảm về quá khứ, thành phần giai cấp và chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc","Lên án giai cấp bóc lột","Không chấp nhận những điềm khác nhau của các giai cấp","Không khoan dung với thế lực thù địch, phản động"],"a":"A"},{"id":"8-41","n":41,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc đối với đội ngũ doanh nhân cần:","o":["Phát huy vai trò sáng tạo của đội ngũ doanh nhân.","Xây dựng đội ngũ doanh nhân có đạo đức nghề nghiệp","Có cơ chế, chính sách bảo đảm quyền lợi của đội ngũ doanh nhân. Tôn vinh những doanh nhân có nhiều đóng góp cho sự nghiệp phát triển đất nướC.","Mở rộng đội ngũ doanh nhân"],"a":"C"},{"id":"8-42","n":42,"t":"Mục đích của đoàn kết dân tộc là:","o":["Giải phóng giai cấp","Làm theo lao động hưởng theo nhu cầu","Giải phóng lao động, thiết lập một chế độ xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Bảo vệ chế độ xã hội chủ nghĩa"],"a":"C"},{"id":"8-43","n":43,"t":"“Đoàn kết dân tộc là tư tưởng nhất quán và là sợi chỉ đỏ xuyên suốt tiến trình lãnh đạo cách mạng của Đảng cộng sản Việt Nam” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"C"},{"id":"8-44","n":44,"t":"“Trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng lấy dân làm gốc” là:","o":["Văn kiện đại hội VI (1986)","Văn kiện đại hội VII ( 1991)","Văn kiện đại hội VIII (1996)","Văn kiện đại hội X (2001)"],"a":"A"},{"id":"8-45","n":45,"t":"“Để phát huy sức mạnh đại đoàn kết toàn dân tộc cần Phát huy vai trò của thế hệ trẻ trong sự nghiệp xây dựng và bảo vệ Tổ quốc. Thu hút rộng rãi thanh niên, thiếu niên và nhi đồng tham gia các tổ chức do Đoàn Thanh niên Cộng sản Hồ Chí Minh làm nòng cốt và phụ trách” là:","o":["Văn kiện đại hội VI (1986)","Văn kiện đại hội VII (1991)","Văn kiện đại hội VIII (1996)","Văn kiện đại hội IX (2001)"],"a":"B"},{"id":"8-46","n":46,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc đối với phụ nữ cần:","o":["Nâng cao trình độ mọi mặt và đời sống vật chất, tinh thần của phụ nữ; thực hiện tốt bình đẳng giới, tạo điều kiện cho phụ nữ phát triển tài năng.","Hoàn thiện văn bản luật liên quan đến kinh tế thị trường để phát triển kinh tế - xã hội","Kiên quyết đấu tranh Diễn biến hòa bình","Xây dựng môi trường văn hóa lành mạnh"],"a":"A"},{"id":"8-47","n":47,"t":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc đối với cựu chiến n Tổ quốc và các đoàn thể nhân dân.","Vận động tuyên truyền mọi người có nhận thức và hành động đúng về kinh tế thị trường","Tham gia phát triển kinh tế - xã hội","Hoàn thiện hệ thống pháp luật"],"a":"A"},{"id":"8-53","n":53,"t":"Bác Hồ nói câu này khi nào? : “Trước Cách mạng tháng Tám và trong kháng chiến thì nhiệm vụ tuyên huấn là làm cho đồng bào các dân tộc hiểu được mấy việc: Một là đoàn kết. Hai là làm cách mạng hay kháng chiến để đòi độc lập. Chỉ đơn giản thế thôi. Bây giờ mục đích tuyên truyền huấn luyện là: Một là đoàn kết. Hai là xây dựng chủ nghĩa xã hội. Ba là đấu tranh thống nhất nước nhà”.","o":["Ngày 31-8-1963, nói chuyện với cán bộ tuyên huấn miền núi về cách mạng xã hội chủ nghĩa","Ngày 31-8-1964, nói chuyện với cán bộ tuyên huấn miền núi về cách mạng xã hội chủ nghĩa,","Ngày 31-8-1966, nói chuyện với cán bộ tuyên huấn miền núi về cách mạng xã hội chủ nghĩa,","Ngày 31-8-1965, nói chuyện với cán bộ tuyên huấn miền núi về cách mạng xã hội chủ nghĩa"],"a":"A"},{"id":"8-54","n":54,"t":"“ Đề cao tinh thần dân tộc, truyền thống nhân nghĩa, khoan dung để tập hợp, đoàn kết mọi người Việt Nam ở trong nước và ngoài nước, tăng cường quan hệ mật thiết của nhân dân với Đảng, Nhà nước, tạo sinh lực mới của khối đại đoàn toàn kết dân tộc” là:","o":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"a":"D"}]},{"id":"9","name":"Bài 9","title":"TU DƯỠNG, RÈN LUYỆN ĐỂ TRỞ THÀNH NGƯỜI CÔNG DÂN TỐT, NGƯỜI LAO ĐỘNG TỐT","q":[{"id":"9-1","n":1,"t":"Chọn phương án trả lời đúng. Người công dân tốt, theo nghĩa chung nhất, là người thực hiện tốt:","o":["Trách nhiệm và nghĩa vụ của mình","Quyền và nghĩa vụ","Lợi ích","Trách nhiệm"],"a":"A"},{"id":"9-2","n":2,"t":"Chọn phương án trả lời đúng nhất. Công dân nước Cộng hoà xã hội chủ nghĩa Việt Nam là người có?","o":["Tên tuổi","Quê quán","Quốc tịch Việt Nam","Hộ khẩu"],"a":"C"},{"id":"9-3","n":3,"t":"Chọn phương án trả lời đúng. Người công dân tốt là người thực "use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const LT='ABCD';
const Q={},ALL=[];
D.forEach(s=>s.q.forEach(q=>{q.s=s.id;q.nz=norm(q.t+' '+q.o.join(' '));q.k=ALL.length;Q[q.id]=q;ALL.push(q)}));
const ALLIDS=ALL.map(q=>q.id);
const secOf=id=>D.find(s=>s.id===id);
const idsOfSec=id=>secOf(id).q.map(q=>q.id);
const isOk=(q,l)=>l===q.a||l===q.x;
const oi=l=>LT.indexOf(l);
const ansTxt=q=>q.a+'. '+q.o[oi(q.a)]+(q.x?' (hoặc '+q.x+'. '+q.o[oi(q.x)]+')':'');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const fmt=t=>new Date(t).toLocaleString('vi-VN');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,isNaN(v)?a:v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mmss=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x)};
const snip=(s,n)=>{s=s.replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s};

/* ===== Lưu trữ ===== */
const KEY='gdct_tien_do_v1';
const fresh=()=>({v:1,prog:{},fav:{},known:{},hist:[],exams:[],pos:{},exam:null,xcfg:null,lastSec:null,set:{theme:null,autoRemove:false,removeN:2}});
let st=fresh();
function load(){let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(j&&typeof j==='object'){st=Object.assign(fresh(),j);st.set=Object.assign(fresh().set,j.set||{});
  ['hist','exams'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});['prog','fav','known','pos'].forEach(k=>{if(!st[k]||typeof st[k]!=='object')st[k]={}})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function rec(id,ok,ns){const p=st.prog[id]||(st.prog[id]={t:0,c:0,w:0,l:null,s:0,ew:0,iw:0});
 p.t++;p.ts=Date.now();
 if(ok){p.c++;p.s++;p.l=1;if(p.iw&&st.set.autoRemove&&p.s>=st.set.removeN)p.iw=0}
 else{p.w++;p.s=0;p.l=0;p.ew=1;p.iw=1}
 if(!ns)save()}
function addHist(type,text){const h={ts:Date.now(),type,text};st.hist.push(h);if(st.hist.length>80)st.hist.shift();return h}
const wrongIds=()=>ALLIDS.filter(id=>st.prog[id]&&st.prog[id].iw);
function stOf(ids){let done=0,ok=0,ng=0,t=0,c=0;ids.forEach(id=>{const p=st.prog[id];if(p){done++;p.l?ok++:ng++;t+=p.t;c+=p.c}});
 return{n:ids.length,done,ok,ng,un:ids.length-done,t,c,w:t-c,acc:t?c/t:0}}
const stat1=id=>{const p=st.prog[id];return !p?'un':p.l?'ok':'ng'};

 const hist=st.hist.slice(-8).reverse().map(h=>`<tr><td><small>${fmt(h.ts)}</small></td><td><span class="tag">${{study:'Học',exam:'Thi thử',review:'Ôn sai'}[h.type]||h.type}</span>${esc(h.text)}</td></tr>`).join('');
 return `<h1>Tổng quan học tập</h1>

 <div class="stat"><small>Số câu đã hoàn thành</small><b>${s.done}</b><small>${pct(s.done,s.n)}% ngân hàng</small></div>
 <div class="stat"><small>Tỷ lệ trả lời đúng</small><b>${s.t?pct(s.c,s.t):0}%</b><small>${s.c}/${s.t} lượt làm</small></div>
 <div class="stat"><small>Đúng · Sai · Chưa học</small><b style="font-size:1.25rem"><span style="color:var(--ok)">${s.ok}</span> · <span style="color:var(--ng)">${s.ng}</span> · ${s.un}</b><small>tính theo lần làm gần nhất</small></div>
 <div class="stat"><small>Câu cần ôn · Yêu thích</small><b style="font-size:1.25rem">${w} · ${fav}</b></div></div>
 <div class="card row" style="gap:20px"><div class="dn" style="background:conic-gradient(var(--ok) 0 ${a}%,var(--ng) ${a}% ${b}%,var(--bd) ${b}% 100%)"><div>${pct(s.done,s.n)}%</div></div>
 <div style="flex:1;min-width:220px"><h2>Bắt đầu nhanh</h2><div class="row">
 ${st.lastSec?`<button class="btn pri" data-a="study" data-v="${st.lastSec}">▶ Tiếp tục học</button>`:`<button class="btn pri" data-a="go" data-v="study">▶ Bắt đầu học</button>`}
 <button class="btn" data-a="go" data-v="exam">📝 Thi thử</button><button class="btn" data-a="go" data-v="review">🔁 Ôn ${w} câu sai</button><button class="btn" data-a="go" data-v="flash">🃏 Flashcard</button></div>

 <div class="card"><h2>Lịch sử học gần đây</h2>${hist?`<div class="tw"><table>${hist}</table></div>`:'<p class="mu">Chưa có hoạt động nào. Hãy bắt đầu học hoặc làm bài thi thử.</p>'}</div>`}

/* ===== Chạy câu hỏi (học / ôn / kết quả tìm kiếm) ===== */
function startRun(home,title,ids,i,key){P={home,title,ids,i:Math.min(Math.max(i,0),ids.length-1),ans:{},h:null,key,sum:false};render(true)}
function filt(ids,f){return ids.filter(id=>f==='all'||(f==='un'&&!st.prog[id])||(f==='done'&&st.prog[id])||(f==='ng'&&st.prog[id]&&!st.prog[id].l)||(f==='fav'&&st.fav[id]))}
function vRun(){
 if(P.sum){const ids=Object.keys(P.ans),ok=ids.filter(id=>isOk(Q[id],P.ans[id])).length;
  return `<div class="card" style="text-align:center"><h2>Hoàn thành: ${esc(P.title)}</h2><p class="big">${ok}/${ids.length}</p><p class="mu">câu đúng trong lượt này (${pct(ok,ids.length)}%)</p>
  <div class="row" style="justify-content:center"><button class="btn" data-a="rgo" data-v="0">Xem lại từ đầu</button><button class="btn pri" data-a="rexit">Chọn nội dung khác</button></div></div>`}
 const id=P.ids[P.i],q=Q[id],a=P.ans[id],n=P.ids.length,p=st.prog[id];
 const o=q.o.map((t,j)=>{const L=LT[j];let c='opt';if(a){if(isOk(q,L))c+=' ok';else if(L===a)c+=' ng'}
  return `<button class="${c}" data-a="pick" data-v="${L}"><b>${L}</b><span>${esc(t)}</span></button>`}).join('');
 const fb=a?(isOk(q,a)?`<div class="fb ok">✓ Chính xác! Đáp án đúng: <b>${esc(ansTxt(q))}</b></div>`:`<div class="fb ng">✗ Chưa đúng. Đáp án đúng: <b>${esc(ansTxt(q))}</b></div>`):'';
 const prev=!a&&p?`<span class="tag ${p.l?'ok':'ng'}">Lần trước: ${p.l?'đúng':'sai'}</span>`:'';
 const rm=a&&P.home==='review'&&st.prog[id]&&st.prog[id].iw&&isOk(q,a)?`<button class="btn sm" data-a="rm" data-v="${id}">Đã nắm — loại khỏi danh sách ôn</button>`:'';
 const grid=P.ids.map((x,k)=>{const r=P.ans[x];return `<button class="qn${r?(isOk(Q[x],r)?' ok':' ng'):''}${k===P.i?' cur':''}" data-a="rgo" data-v="${k}">${k+1}</button>`}).join('');
 const back=P.home==='search'?'← Kết quả tìm kiếm':'← Đổi nội dung';
 return `<div class="row sb" style="margin-bottom:10px"><button class="btn sm" data-a="rexit">${back}</button><b>${esc(P.title)}</b></div>
 <div class="bar" style="margin-bottom:12px"><i style="width:${(P.i+1)/n*100}%;background:var(--pr)"></i></div>
 <div class="card"><div class="row sb"><span><span class="tag">${esc(secOf(q.s).name)}</span><span class="tag">Câu ${q.n}</span> <small>(${P.i+1}/${n})</small> ${prev}</span>
 <button class="star${st.fav[id]?' on':''}" data-a="fav" data-v="${id}" title="Yêu thích">★</button></div>
 <div class="qt">${esc(q.t)}</div>${o}${fb}${q.w?`<div class="note">⚠ ${esc(q.w)}</div>`:''}${rm}</div>
 <div class="row sb"><button class="btn" data-a="rgo" data-v="${P.i-1}" ${P.i?'':'disabled'}>← Câu trước</button>
 ${P.i<n-1?`<button class="btn pri" data-a="rgo" data-v="${P.i+1}">Câu tiếp theo →</button>`:`<button class="btn pri" data-a="rsum">Kết thúc</button>`}</div>
 <details class="card" style="margin-top:16px"><summary>Danh sách câu hỏi (${n})</summary><div class="qg">${grid}</div></details>`}
const A={};
A.pick=L=>{const id=P.ids[P.i];if(P.ans[id])return;P.ans[id]=L;rec(id,isOk(Q[id],L),true);
 const ids=Object.keys(P.ans),ok=ids.filter(x=>isOk(Q[x],P.ans[x])).length;
 const txt=`${P.title}: ${ok}/${ids.length} câu đúng`;
 if(!P.h||st.hist.indexOf(P.h)<0)P.h=addHist(P.home==='review'?'review':'study',txt);else{P.h.text=txt;P.h.ts=Date.now()}
 save();render()};
A.rgo=v=>{P.i=Math.min(Math.max(+v,0),P.ids.length-1);P.sum=false;if(P.home==='study'&&SF==='all'&&P.key){st.pos[P.key]=P.i;save()}render(true)};
A.rsum=()=>{P.sum=true;render(true)};
A.rexit=()=>{P=null;render(true)};
A.rm=id=>{if(st.prog[id])st.prog[id].iw=0;save();toast('Đã loại khỏi danh sách ôn tập');render()};
A.fav=id=>{if(st.fav[id])delete st.fav[id];else st.fav[id]=1;save();refresh()};
